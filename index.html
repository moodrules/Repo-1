/* --------------------------- custom split sheet ------------------------- */
function customState(item){
  const ids = state.check.people.map(p=>p.id);
  const vals = item.custom.values || {};
  const line = lineTotal(item);
  let used = 0;
  if (item.custom.unit === 'percent'){
    const pct = ids.reduce((a,id)=> a + (Number(vals[id])||0), 0);
    used = Math.round(line * pct / 100);
    return {line, used, pct, remaining: line - used};
  }
  used = ids.reduce((a,id)=> a + Math.round(Number(vals[id])||0), 0);
  return {line, used, pct:null, remaining: line - used};
}
function CustomSheet(item){
  const c = state.check;
  const cs = customState(item);
  const unit = item.custom.unit;
  const rows = c.people.map(p => {
    const raw = item.custom.values[p.id];
    const val = raw == null || raw === '' ? '' : (unit === 'percent' ? raw : plain(raw));
    return `<div class="row" style="gap:12px">
      ${Avatar(p.name)}
      <span class="grow" style="font-weight:600">${esc(p.name)}</span>
      <label class="money-wrap" style="width:130px">
        <span class="cur">${unit==='percent'?'%':esc(c.currency)}</span>
        <span class="sr">${esc(p.name)}'s share</span>
        <input inputmode="decimal" value="${esc(val)}" placeholder="0" data-field="custom-value" data-item="${item.id}" data-person="${p.id}">
      </label>
    </div>`;
  }).join('');

  return `<div class="grabber"></div>
  <div class="stack" role="dialog" aria-modal="true" aria-label="Custom split for ${esc(item.name||'item')}">
    <div class="between">
      <div><h2 style="font-size:20px; font-weight:700">Custom split</h2>
      <div class="tiny dim">${esc(item.name || 'Untitled item')} · ${money(cs.line)}</div></div>
      <button class="btn-icon" data-act="close-sheet" aria-label="Close">✕</button>
    </div>
    <div class="seg" role="group" aria-label="Split by">
      <button aria-pressed="${unit==='amount'}" data-act="custom-unit" data-item="${item.id}" data-val="amount">Fixed amounts</button>
      <button aria-pressed="${unit==='percent'}" data-act="custom-unit" data-item="${item.id}" data-val="percent">Percentages</button>
    </div>
    <div class="stack-sm">${rows}</div>
    <div class="card card-flat between">
      <span class="dim tiny">Allocated</span>
      <span class="amount" data-live="custom-alloc:${item.id}">${money(cs.used)} / ${money(cs.line)}</span>
    </div>
    <div class="tiny" data-live="custom-msg:${item.id}" style="font-weight:600; color:${cs.remaining===0?'var(--success)':'var(--accent)'}">${customMessage(item)}</div>
    <div class="row">
      <button class="btn btn-ghost grow" data-act="custom-equal" data-item="${item.id}">Split equally</button>
      <button class="btn btn-primary grow" data-act="close-sheet">Done</button>
    </div>
  </div>`;
}
function customMessage(item){
  const cs = customState(item);
  if (cs.remaining > 0) return `${money(cs.remaining)} still needs to be allocated.`;
  if (cs.remaining < 0) return `${money(-cs.remaining)} more than the item costs.`;
  return 'This item is fully allocated.';
}

/* ----------------------------- live updates ---------------------------- */
/* Typed fields update state directly (so the caret never jumps) and these
   derived read-outs refresh in place. */
function liveValue(key){
  const [kind, id] = key.split(':');
  const calc = () => compute();
  switch(kind){
    case 'line':   { const i = findItem(id); return i ? money(lineTotal(i)) : ''; }
    case 'qty':    { const i = findItem(id); return i ? String(i.qty) : ''; }
    case 'subtotal':      return money(calc().itemsSubtotal);
    case 'discountline':  return '−' + money(calc().discount);
    case 'afterdiscount': return money(calc().discountedSubtotal);
    case 'serviceline':   return money(calc().service);
    case 'taxable':       return money(calc().taxable);
    case 'vat':           return money(calc().vat);
    case 'checktotal':    return money(calc().checkTotal);
    case 'ptotal':    { const r = calc().rows.find(r => r.id === id); return r ? money(r.total) : ''; }
    case 'custom-alloc': { const i = findItem(id); if(!i) return ''; const cs = customState(i); return `${money(cs.used)} / ${money(cs.line)}`; }
    case 'custom-msg':   { const i = findItem(id); return i ? customMessage(i) : ''; }
    default: return '';
  }
}
function refreshLive(){
  document.querySelectorAll('[data-live]').forEach(node => {
    const v = liveValue(node.dataset.live);
    if (v !== '' && node.textContent !== v) node.textContent = v;
  });
  const msg = document.querySelector('[data-live^="custom-msg"]');
  if (msg){
    const item = findItem(msg.dataset.live.split(':')[1]);
    if (item) msg.style.color = customState(item).remaining === 0 ? 'var(--success)' : 'var(--accent)';
  }
  persist();
}
const findItem = id => state.check.items.find(i => i.id === id);

/* -------------------------------- render ------------------------------- */
function render(){
  const app = document.getElementById('app');
  const screens = {start:StartScreen, people:PeopleScreen, check:CheckScreen, assign:AssignScreen, summary:SummaryScreen};
  app.innerHTML = (state.step === 'start' ? '' : Stepper()) + screens[state.step]() + Credit();
  renderSheet();
  wireDropzone();
  persist();
}
function renderSheet(){
  const root = document.getElementById('sheet-root');
  const open = state.ui.sheet;
  if (!open){ root.innerHTML = ''; return; }
  const item = findItem(open);
  if (!item){ state.ui.sheet = null; root.innerHTML=''; return; }
  root.innerHTML = `<div class="backdrop" data-act="close-sheet"></div><div class="sheet">${CustomSheet(item)}</div>`;
  const first = root.querySelector('input'); if (first) first.focus();
}
function wireDropzone(){
  const zone   = document.getElementById('dropzone');
  const scan   = document.getElementById('scan-card');
  const camera = document.getElementById('file-input');
  const upload = document.getElementById('file-upload');
  if (!zone || !camera || !upload) return;
  if (OCR_UI_ENABLED) preflightOcr();   // decide and prove the engine before the user taps anything

  const pick = input => { input.value = ''; input.click(); };
  if (scan) scan.addEventListener('click', () => pick(camera));
  zone.addEventListener('click', () => pick(upload));
  zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(upload); }});

  [camera, upload].forEach(input => input.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (f) handleImage(f);
  }));

  ['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('over'); }));
  zone.addEventListener('drop', e => { const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handleImage(f); });
}

const SCAN_STAGES = [
  {id:'prep',    label:'Preparing receipt'},
  {id:'engine',  label:'Starting the reader'},
  {id:'reading', label:'Reading receipt'},
  {id:'extract', label:'Preparing your receipt'}
];
/* The photo is captured and kept here; the reading happens in Claude chat and
   comes back through the existing import adapter. No new pipeline. */
function handlePhotoHandoff(file){
  if (!/^image\//.test(file.type)) return toast('That file isn\'t an image. Pick a JPG or PNG photo.', true);
  if (file.size > 20 * 1024 * 1024) return toast('That photo is over 20 MB. Try a smaller one.', true);
  freePreview();
  state.ui.preview = URL.createObjectURL(file);
  state.ui.lastFile = file;
  state.ui.manualImportOpen = true;
  state.ui.manualImportError = null;
  ocrLog('IMAGE_RECEIVED', `${Math.round(file.size/1024)}KB ${file.type}`);
  render();
  toast('Photo ready — send it to Claude, then paste the list back here.');
}

function freePreview(){
  if (state.ui.preview && state.ui.preview.startsWith('blob:')) URL.revokeObjectURL(state.ui.preview);
  state.ui.preview = null;
}
function setOcrProgress(stage, pct, label){
  if (!state.ui.importing) return;                       // cancelled — ignore late reports
  const cur = state.ui.importing;
  const changedStage = cur.stage !== stage;
  state.ui.importing = Object.assign(cur, {stage, pct, label});
  const bar = document.getElementById('ocr-bar');
  const txt = document.getElementById('ocr-label');
  if (bar && txt && !changedStage){                       // cheap in-place update, no re-render
    bar.style.width = Math.round(pct*100) + '%';
    txt.textContent = label;
  } else render();
}

async function handleImage(file){
  if (!OCR_UI_ENABLED) return handlePhotoHandoff(file);
  if (state.ui.importing) return;                        // one at a time: no duplicate submissions
  state.ui.lastFile = file;                              // usable by the capability test even if the scan can't run
  state.ui.ocrError = null;
  // Preview appears in the same frame the processing state does — createObjectURL
  // is synchronous, unlike reading the whole file into a data URL.
  if (state.ui.preview && state.ui.preview.startsWith('blob:')) URL.revokeObjectURL(state.ui.preview);
  state.ui.preview = /^image\//.test(file.type) ? URL.createObjectURL(file) : null;
  ocrLog('IMAGE_RECEIVED', `${Math.round((file.size||0)/1024)}KB ${file.type||'unknown type'}`);
  const token = {cancelled:false};
  state.ui.lastFile = file;            // so "Try again" never asks for the photo twice
  state.ui.importing = {stage:'prep', pct:0.05, label:'Preparing receipt…', token, name:file.name, startedAt:Date.now(), slow:false};
  render();
  // After a while the copy softens instead of alarming the user.
  const slowTimer = setTimeout(() => {
    if (state.ui.importing && state.ui.importing.token === token){ state.ui.importing.slow = true; render(); }
  }, activeProvider.id === 'claude-vision' ? SLOW_HINT_VISION_MS : SLOW_HINT_MS);

  try{
    const detected = await detectReader();
    activeProvider = providerFor(detected.kind);
    // A blocked browser capability is knowable before any download starts.
    if (detected.kind === 'blocked') throw new ScanError(detected.why, detected.reason);
    const data = await extractCheckFromImage(file, setOcrProgress, token);
    if (token.cancelled) return;
    clearTimeout(slowTimer);
    if (state.ui.importing && state.ui.importing.token !== token) return;   // superseded by a newer run
    state.ui.importing = false;
    ocrLog('RECEIPT_EXTRACTION_SUCCESS', `${data.items.length} items via ${activeProvider.id}`);
    if (OCR_STATUS.provenRoundTrip && OCR_STATUS.state === 'configured'){
      OCR_STATUS.state = 'ready'; OCR_STATUS.stages.smoke = true;
      ocrLog('READER_INIT_SUCCESS', 'OCR_READY — proven on a real receipt');
      ocrLog('OCR_READY', BACKEND_URL || '');
    }
    applyExtraction(data);
    toast(`Receipt read — ${data.items.length} ${data.items.length===1?'item':'items'} found. Check them before continuing.`);
  }catch(err){
    if (token.cancelled || err instanceof CancelledError){ return; }
    if (state.ui.importing && state.ui.importing.token !== token) return;
    state.ui.importing = false;
    const kind = err instanceof ScanError ? err.kind : 'unreadable';
    ocrLog('READER_REQUEST_FAILED', kind + ': ' + (err && err.message));
    state.ui.ocrError = {kind, detail: err && err.message};
    render();
  }finally{
    clearTimeout(slowTimer);
  }
}

/* ------------------------------- actions -------------------------------- */
function shareText(){
  const c = state.check, calc = compute();
  const L = [];
  L.push('Receipt Split');
  if (c.merchant) L.push('Restaurant: ' + c.merchant);
  if (c.date) L.push('Date: ' + c.date);
  L.push('');
  calc.rows.forEach(r => {
    L.push(r.name);
    r.lines.forEach(l => L.push(`  ${l.name}${l.qtyLabel ? ' ' + l.qtyLabel : ''} — ${money(l.cents)}`));
    if (r.service)  L.push(`  Service charge — ${money(r.service)}`);
    if (r.discount) L.push(`  Discount — −${money(r.discount)}`);
    if (!c.vatIncluded && r.vat) L.push(`  ${taxRegion(c).vatLabel} — ${money(r.vat)}`);
    L.push(`  Total: ${money(r.total)}`);
    L.push('');
  });
  L.push(`Subtotal: ${money(calc.itemsSubtotal)}`);
  if (calc.discount) L.push(`Discount: −${money(calc.discount)}`);
  if (calc.service)  L.push(`Service charge: ${money(calc.service)}`);
  L.push(`${taxRegion(c).vatLabel} (${calc.ratePct}%${c.vatIncluded ? ', included' : ''}): ${money(calc.vat)}`);
  L.push(`Total: ${money(calc.checkTotal)}`);
  if (calc.unassignedTotal) L.push(`Unassigned: ${money(calc.unassignedTotal)}`);
  return L.join('\n');
}

async function copyText(text, okMsg){
  try{
    await navigator.clipboard.writeText(text);
    toast(okMsg || 'Copied.');
  }catch(_){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(okMsg || 'Copied.'); }
    catch(e){ toast("Couldn't copy here — select the text and copy it manually.", true); }
    ta.remove();
  }
}

async function copySummary(){
  const text = shareText();
  try{
    await navigator.clipboard.writeText(text);
    toast('Summary copied.');
  }catch(_){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Summary copied.'); }
    catch(e){ toast("Couldn't copy here — select the text and copy it manually.", true); }
    ta.remove();
  }
}
async function shareSummary(){
  const text = shareText();
  if (navigator.share){
    try { await navigator.share({title:'Dinner split', text}); return; }
    catch(e){ if (e && e.name === 'AbortError') return; }
  }
  copySummary();
}

function goCalculate(){
  const calc = compute();
  if (calc.invalid.length){
    toast(`${calc.invalid.length} custom ${calc.invalid.length===1?'split doesn\'t':'splits don\'t'} add up to the item price. Fix ${calc.invalid.length===1?'it':'them'} to continue.`, true);
    return;
  }
  if (calc.unassigned.length && !state.ui.allowUnassigned){
    state.ui.confirmUnassigned = {count: calc.unassigned.length, amount: calc.unassignedTotal};
    render();
    return;
  }
  state.ui.confirmUnassigned = null;
  setStep('summary');
}

const actions = {
  start: () => { state.check = newCheck(); state.ui.checkView='import'; setStep('people'); },
  home: () => setStep('start'),
  example: loadExample,
  reset: () => {
    if (!state.ui.confirmReset){
      state.ui.confirmReset = true;
      toast('Tap once more to clear this check and start over.');
      setTimeout(()=> state.ui.confirmReset = false, 4000);
      return;
    }
    resetAll();
  },
  'force-calculate': () => { state.ui.allowUnassigned = true; state.ui.confirmUnassigned = null; setStep('summary'); },
  'cancel-unassigned': () => { state.ui.confirmUnassigned = null; render(); },
  back: goBack,
  'add-person': () => addPerson(state.ui.nameDraft),
  'remove-person': d => removePerson(d.person),
  'to-check': () => setStep('check'),
  manual: () => { state.ui.ocrError = null; state.check.source = 'manual'; state.check.items = [newItem(), newItem()]; state.ui.checkView = 'review'; render(); },
  rescan: () => { state.ui.checkView = 'import'; freePreview(); state.ui.ocrError = null; render(); },
  'cancel-scan': () => {
    const imp = state.ui.importing;
    if (imp && imp.token){ imp.token.cancelled = true; if (imp.token.abort) try { imp.token.abort(); } catch(_){} }
    state.ui.importing = false; state.ui.ocrError = null;
    render();
  },
  'cap-text': async () => {
    state.ui.capability = true; render();
    toast('Asking the reader for one word…');
    await capabilityTextTest();
    render();
  },
  'cap-image': async () => {
    if (!state.ui.lastFile) return toast('Choose a receipt photo first.', true);
    state.ui.capability = true; render();
    toast('Sending your receipt photo to the reader…');
    if (CAPABILITY.text !== true) await capabilityTextTest();
    await capabilityImageTest(state.ui.lastFile);
    if (CAPABILITY.image === true){
      // Proven: only now may the production reader come up.
      preflightRun = null; OCR_STATUS.state = 'unknown';
      await preflightOcr();
    }
    render();
  },
  diagnose: async () => {
    toast('Checking each part of the text engine…');
    state.ui.diagnostics = await runOcrDiagnostics();
    render();
  },
  'retry-same': () => {
    const f = state.ui.lastFile;
    state.ui.ocrError = null;
    if (!f) return render();
    scanCache.delete(fileKey(f));     // a retry should genuinely re-read, not replay the miss
    return handleImage(f);
  },
  'retry-scan': () => { state.ui.ocrError = null; freePreview(); render(); const i = document.getElementById('file-upload'); if (i){ i.value=''; i.click(); } },
  /* [remove-me: start] manual import actions */
  'mi-open': () => { state.ui.manualImportOpen = !state.ui.manualImportOpen; state.ui.manualImportError = null; render(); },
  'mi-copy-prompt': () => copyText(AI_IMPORT_PROMPT, 'Instructions copied — send them with your receipt photo.'),
  'mi-clear': () => { state.ui.manualImportText = ''; state.ui.manualImportError = null; render(); },
  'mi-sample': () => {
    state.ui.manualImportText = MANUAL_IMPORT_SAMPLE.receipt.items
      .map(i => `${i.name} | ${i.quantity} | ${i.unit_price.toFixed(2)} | ${i.line_total.toFixed(2)}`).join('\n');
    state.ui.manualImportError = null; render();
  },
  'mi-import': () => {
    try{
      const data = normalizeImportedReceipt(state.ui.manualImportText || '');
      state.ui.manualImportError = null;
      state.ui.manualImportOpen = false;
      applyExtraction(data, 'manual-import');    // the same seam every reader uses
      toast(`Imported ${data.items.length} ${data.items.length === 1 ? 'item' : 'items'} — check them before splitting.`);
    }catch(e){
      state.ui.manualImportError = (e instanceof ImportError) ? e.message : 'That data could not be imported.';
      render();
    }
  },
  /* [remove-me: end] */
  'add-item': () => { state.check.items.push(newItem()); render(); },
  'delete-item': d => { state.check.items = state.check.items.filter(i => i.id !== d.item); render(); },
  qty: d => {
    const i = findItem(d.item); if(!i) return;
    i.qty = clamp(i.qty + Number(d.delta), 1, 99);
    if (i.qty > 1 && i.mode === 'people' && !i.people.length) i.mode = 'units';
    if (i.qty === 1 && i.mode === 'units') i.mode = 'people';
    // Trim assignments that no longer fit the new quantity.
    while (assignedUnits(i) > i.qty){
      const pid = Object.keys(unitsOf(i)).find(k => unitsFor(i,k) > 0);
      if (!pid) break;
      if (unitsFor(i,pid) <= 1) delete i.units[pid]; else i.units[pid] -= 1;
    }
    render();
  },
  vat: d => { state.check.vatIncluded = d.val === 'included'; render(); },
  country: d => {
    const reg = TAX_REGIONS[d.val];
    if (!reg) return;
    state.check.country = reg.code;
    state.check.vatRateOverride = null;
    syncCurrency();      // an explicit country choice wins over a scanned rate
    render();
  },
  'ocr-lang': d => {
    if (!OCR_LANGUAGES.some(l => l.code === d.val)) return;
    state.check.ocrLang = d.val;      // only this model is downloaded, on the next scan
    render();
  },
  'clear-vat-rate': () => { state.check.vatRateOverride = null; render(); },
  'toggle-charge': d => {
    const t = d.which === 'service' ? state.check.serviceCharge : state.check.discount;
    t.enabled = !t.enabled;
    render();
  },
  'charge-mode': d => {
    const target = d.which === 'service' ? state.check.serviceCharge : state.check.discount;
    if (target.mode !== d.val){ target.mode = d.val; target.value = 0; }
    render();
  },
  'to-assign': () => {
    const bad = state.check.items.find(i => lineTotal(i) <= 0);
    if (bad){ toast(`"${bad.name || 'One item'}" has no price. Add one, or delete the line.`, true); return; }
    const unnamed = state.check.items.find(i => !i.name.trim());
    if (unnamed){ toast('Every item needs a name so people know what they\'re paying for.', true); return; }
    setStep('assign');
  },
  'add-unit': d => {
    const item = findItem(d.item); if (!item) return;
    if (remainingUnits(item) <= 0) return toast(`All ${item.qty} already assigned. Take one back first.`, true);
    unitsOf(item)[d.person] = unitsFor(item, d.person) + 1;
    render();
  },
  'remove-unit': d => {
    const item = findItem(d.item); if (!item) return;
    const n = unitsFor(item, d.person);
    if (n <= 1) delete unitsOf(item)[d.person]; else unitsOf(item)[d.person] = n - 1;
    render();
  },
  'units-clear': d => { const item = findItem(d.item); if (item){ item.units = {}; render(); } },
  'units-everyone': d => {
    const item = findItem(d.item); if (!item) return;
    const ids = state.check.people.map(p=>p.id);
    if (!ids.length) return;
    item.units = {};
    // Whole units only — leftovers stay unassigned rather than being invented.
    const each = Math.floor(item.qty / ids.length);
    ids.forEach(id => { if (each) item.units[id] = each; });
    let extra = item.qty - each * ids.length;
    for (let i = 0; i < extra; i++) item.units[ids[i]] = (item.units[ids[i]] || 0) + 1;
    render();
  },
  'mode-units': d => {
    const item = findItem(d.item); if (!item) return;
    item.mode = 'units'; item.units = item.units || {};
    render();
  },
  'mode-share': d => {
    const item = findItem(d.item); if (!item) return;
    item.mode = 'people'; item.people = Object.keys(unitsOf(item)).filter(id => unitsFor(item,id) > 0);
    render();
  },
  'toggle-person': d => {
    const item = findItem(d.item); if (!item) return;
    if (item.mode !== 'people'){ item.mode = 'people'; item.people = []; }
    item.people = item.people.includes(d.person) ? item.people.filter(x => x !== d.person) : [...item.people, d.person];
    render();
  },
  'toggle-everyone': d => {
    const item = findItem(d.item); if (!item) return;
    if (item.mode === 'everyone'){ item.mode = 'people'; item.people = []; }
    else { item.mode = 'everyone'; item.people = []; }
    render();
  },
  'open-custom': d => {
    const item = findItem(d.item); if (!item) return;
    if (item.mode !== 'custom'){
      const prior = item.mode === 'everyone' ? state.check.people.map(p=>p.id) : item.people;
      item.mode = 'custom';
      item.custom = {unit:'amount', values:{}};
      if (prior.length){
        const parts = allocate(lineTotal(item), prior.map(()=>1));
        prior.forEach((id,i)=> item.custom.values[id] = parts[i]);
      }
    }
    state.ui.sheet = item.id; render();
  },
  'custom-unit': d => {
    const item = findItem(d.item); if (!item) return;
    const line = lineTotal(item);
    const old = item.custom.values || {};
    const next = {};
    Object.entries(old).forEach(([pid, v]) => {
      const n = Number(v) || 0;
      next[pid] = d.val === 'percent' ? (line ? Math.round((n / line) * 1000)/10 : 0) : Math.round(line * n / 100);
    });
    item.custom = {unit:d.val, values:next};
    render();
  },
  'custom-equal': d => {
    const item = findItem(d.item); if (!item) return;
    const ids = state.check.people.map(p=>p.id);
    const values = {};
    if (item.custom.unit === 'percent'){
      const each = Math.round((100/ids.length) * 10) / 10;
      ids.forEach((id,i)=> values[id] = i === ids.length-1 ? Math.round((100 - each*(ids.length-1))*10)/10 : each);
    } else {
      const parts = allocate(lineTotal(item), ids.map(()=>1));
      ids.forEach((id,i)=> values[id] = parts[i]);
    }
    item.custom.values = values; render();
  },
  'close-sheet': () => { state.ui.sheet = null; render(); },
  calculate: goCalculate,
  'assign-back': () => { state.ui.allowUnassigned = false; setStep('assign'); },
  share: shareSummary,
  copy: copySummary
};

/* --------------------------- event delegation --------------------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (fn){ e.preventDefault(); fn(el.dataset, e); }
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-field]');
  if (!el) return;
  const f = el.dataset.field, v = el.value;
  if (f === 'mi-json'){ state.ui.manualImportText = v; return; }   /* [remove-me] */
  if (f === 'currency'){               // only reachable under "Other / Custom"
    state.check.customCurrency = String(v).toUpperCase().slice(0, 5);
    syncCurrency(); refreshLive(); return;
  }
  if (f === 'vat-rate'){
    const n = parseFloat(String(v).replace(/[^0-9.]/g,''));
    state.check.vatRateOverride = Number.isFinite(n) ? clamp(n, 0, 99) / 100 : 0;
    refreshLive(); return;
  }
  if (f === 'merchant'){ state.check.merchant = v; persist(); return; }
  if (f === 'date'){ state.check.date = v; persist(); return; }
  if (f === 'person-draft'){ state.ui.nameDraft = v; return; }
  if (f === 'person-name'){
    const p = state.check.people.find(p => p.id === el.dataset.person);
    if (p) p.name = v;
    refreshLive(); return;
  }
  const item = findItem(el.dataset.item);
  if (f === 'item-name' && item){ item.name = v; persist(); return; }
  if (f === 'item-price' && item){
    const cents = parseMoney(v);
    item.unitPrice = cents == null ? 0 : Math.max(0, cents);
    item.flagged = false;
    refreshLive(); return;
  }
  if (f === 'custom-value' && item){
    const pid = el.dataset.person;
    if (v.trim() === ''){ delete item.custom.values[pid]; }
    else if (item.custom.unit === 'percent'){ item.custom.values[pid] = Math.max(0, Number(v.replace(/[^0-9.]/g,'')) || 0); }
    else { const cents = parseMoney(v); item.custom.values[pid] = cents == null ? 0 : Math.max(0, cents); }
    refreshLive(); return;
  }
  if (f === 'service-value' || f === 'discount-value'){
    const target = f === 'service-value' ? state.check.serviceCharge : state.check.discount;
    target.value = target.mode === 'percent' ? clamp(Number(v.replace(/[^0-9.]/g,'')) || 0, 0, 100) : Math.max(0, parseMoney(v) || 0);
    refreshLive(); return;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'person-input'){ e.preventDefault(); addPerson(e.target.value); }
  if (e.key === 'Escape' && state.ui.sheet){ state.ui.sheet = null; render(); }
});
document.addEventListener('blur', e => {
  const el = e.target.closest && e.target.closest('[data-field]');
  if (!el) return;
  if (el.dataset.field === 'item-price'){ const i = findItem(el.dataset.item); if (i) el.value = plain(i.unitPrice); }
  if (el.dataset.field === 'person-name'){
    const p = state.check.people.find(p => p.id === el.dataset.person);
    if (p && !p.name.trim()){ p.name = 'Guest'; render(); toast('A name can\'t be empty — called them Guest for now.'); }
  }
}, true);

/* --------------------------------- boot -------------------------------- */
window.addEventListener('popstate', e => {
  // The device back button walks the same path as the in-app one.
  if (state.ui.sheet){ state.ui.sheet = null; render(); return; }
  const st = e.state;
  if (st && st.step){
    if (st.checkView) state.ui.checkView = st.checkView;
    setStep(st.step, true);
  } else {
    const t = backTarget();
    if (t){ if (t.checkView) state.ui.checkView = t.checkView; setStep(t.step, true); }
  }
});

activeProvider = pickProvider();
restore();
render();
// Capability resolution is async and never instant; re-render once it lands so
// the import screen reflects what can actually be done here.
detectLocalEngine().then(present => {
  if (!present){
    ocrLog('ENGINE_ABSENT', 'no same-origin engine under ' + OCR_SOURCE_SETS[0].worker + ' — photo hand-off stays in use');
    return;
  }
  OCR_UI_ENABLED = true;
  ocrLog('ENGINE_PRESENT', 'same-origin engine found — on-device reading enabled, proving it now');
  render();                               // brings up the reading UI and runs the smoke test
  return detectReader().then(r => {
    activeProvider = providerFor(r.kind);
    if (state.step === 'check' && state.ui.checkView === 'import') render();
  });
});
try { history.replaceState({step: state.step, checkView: state.ui.checkView}, ''); } catch(_){}
</script>
