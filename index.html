    const p = workerPromise; workerPromise = null;
    try { (await p).terminate(); } catch(_){}
  }, 120000);
}
/** Fetch the library early (idle, non-blocking) so the first tap isn't waiting on a download. */
/* Run once, early: pick the engine and prove it works, so the scan buttons
   are only offered when a receipt can actually be read. */
let preflightRun = null;
function preflightOcr(){
  if (preflightRun) return preflightRun;
  preflightRun = (async () => {
    try { await initOcrEngine(null); }
    catch(_){ /* OCR_STATUS carries the reason */ }
    if (state.step === 'check' && state.ui.checkView === 'import') render();
    return OCR_STATUS;
  })();
  return preflightRun;
}

function warmOcr(){
  if (activeProvider.id !== 'tesseract-client') return;   // nothing to prefetch for the vision reader
  if (window.Tesseract || tesseractLoading) return;
  const go = () => loadTesseract(null).catch(()=>{});
  (window.requestIdleCallback || (fn => setTimeout(fn, 1200)))(go);
}
const yieldToUI = () => new Promise(r => setTimeout(r, 0));
function rotateCanvas(src, degrees){
  const swap = degrees % 180 !== 0;
  const c = document.createElement('canvas');
  c.width  = swap ? src.height : src.width;
  c.height = swap ? src.width  : src.height;
  const ctx = c.getContext('2d');
  ctx.translate(c.width/2, c.height/2);
  ctx.rotate(degrees * Math.PI / 180);
  ctx.drawImage(src, -src.width/2, -src.height/2);
  return c;
}
const fileKey = f => `${f.name}|${f.size}|${f.lastModified}`;

const tesseractProvider = {
  id:'tesseract-client',
  connected:true,
  label:'On-device OCR (Tesseract, WebAssembly)',
  async extract(file, onProgress, token){
    const stop = () => { if (token && token.cancelled) throw new CancelledError(); };
    const key = fileKey(file);
    if (scanCache.has(key)){
      onProgress && onProgress('extract', 1, 'Preparing your receipt…');
      return scanCache.get(key);
    }
    progressSink = onProgress;
    onProgress && onProgress('prep', 0.08, 'Preparing receipt…');

    // Engine start-up and image preparation are independent — run them together.
    const enginePromise = readyWorker(onProgress);     // proves the engine (smoke test, once per session) AND returns the worker
    const canvasPromise = preprocessImage(file);
    let canvas = null, worker = null, prep = null;
    try{
      try{
        [worker, prep] = await Promise.all([
          withTimeout(enginePromise, engineEverLoaded ? ENGINE_TIMEOUT_MS : ENGINE_FIRST_RUN_TIMEOUT_MS, 'timeout', 'engine init timeout'),
          canvasPromise
        ]);
      }catch(e){
        if (e instanceof CancelledError) throw e;
        // Keep the specific reason the stage itself reported; only an
        // unclassified failure gets the connection check.
        if (e instanceof ScanError && e.kind !== 'timeout') throw e;
        ocrLog('READER_INIT_FAILED', (e && e.message) || 'engine stage failed');
        const reachable = await probeEngineReachable();
        throw new ScanError(reachable ? 'timeout' : 'cdn', (e && e.message) || 'engine unavailable');
      }
      canvas = prep.canvas;
      stop();
      onProgress && onProgress('reading', 0.45, 'Reading receipt…');
      await yieldToUI();

      // Only the outputs this app actually reads.
      const OUTPUT = {text:true, blocks:true, hocr:false, tsv:false, box:false, unlv:false, osd:false};
      let { data } = await withTimeout(worker.recognize(canvas, {}, OUTPUT), RECOGNIZE_TIMEOUT_MS, 'timeout', 'recognition timeout');
      stop();
      let parsed = parseReceipt(collectLines(data), data.confidence);

      // Sideways photo? Only pay for a re-read when the upright pass found nothing.
      if (!parsed.items.length){
        for (const deg of [90, 270]){
          stop();
          onProgress && onProgress('reading', 0.7, 'Trying a different orientation…');
          const rotated = rotateCanvas(canvas, deg);
          const retry = await worker.recognize(rotated, {}, OUTPUT);
          rotated.width = 0; rotated.height = 0;
          const p2 = parseReceipt(collectLines(retry.data), retry.data.confidence);
          if (p2.items.length){ parsed = p2; break; }
        }
      }
      stop();
      onProgress && onProgress('extract', 0.97, 'Preparing your receipt…');
      if (parsed.items.length) scanCache.set(key, parsed);
      if (scanCache.size > 5) scanCache.delete(scanCache.keys().next().value);
      return parsed;
    } finally {
      progressSink = null;
      if (canvas){ canvas.width = 0; canvas.height = 0; }
      retireWorkerSoon();                       // kept warm for the next scan, not leaked
    }
  }
};
/* ===================== engine B: Claude vision (messages API) ============
   Used ONLY where on-device Tesseract cannot run — inside the Claude artifact
   runtime, whose sandbox cannot host a Worker script, WASM core or language
   model on its own origin (see the capability findings in probeReader).
   The runtime authenticates this call itself: no API key lives in this file,
   and none should ever be put here. Deployed copies never take this path. */
const RECEIPT_PROMPT = `This image is a photo of a restaurant receipt or bill.
Read it and reply with ONLY a JSON object, no prose and no markdown fences:
{"merchant":string|null,"date":string|null,"time":string|null,
 "receiptNumber":string|null,"paymentMethod":string|null,
 "country":"EG"|"AE"|"SA"|null,"currency":string|null,
 "vatIncluded":boolean|null,"vatRate":number|null,
 "items":[{"name":string,"qty":number,"unitPrice":number,"confidence":number}],
 "subtotal":number|null,"discount":number|null,"serviceCharge":number|null,
 "vat":number|null,"grandTotal":number|null,"confidence":number|null,
 "warnings":[string]}
Rules:
- Every money value is an INTEGER in minor units: 45.00 becomes 4500.
- unitPrice is the price of ONE unit, not the line total.
- items contains only food, drink and similar purchased lines. Never include
  subtotal, VAT, tax, service charge, discount, total, change, cash or card lines.
- vatRate is a fraction, e.g. 0.14 for 14%. Use null if the receipt does not state it.
- confidence is 0 to 1 per line; the top-level one covers the whole reading.
- If a line is too unclear to read, leave it out and note it in warnings.
- If a value is not printed on the receipt, use null. Do not calculate it.
- If the image is not a receipt, reply {"items":[]}.`;

function mapVisionResult(data){
  if (!data || typeof data !== 'object') throw new ScanError('unreadable', 'reader returned no object');
  const num = v => (typeof v === 'number' && isFinite(v)) ? Math.round(v) : null;
  const items = Array.isArray(data.items) ? data.items
    .filter(i => i && i.name && num(i.unitPrice) !== null && !NON_ITEM.test(String(i.name)))
    .map(i => ({
      name: String(i.name).slice(0, 60),
      qty: clamp(Math.round(Number(i.qty) || 1), 1, 99),
      unitPrice: Math.max(0, num(i.unitPrice) || 0),
      confidence: clamp(Number(i.confidence) || 0.8, 0.05, 0.97)
    })).filter(i => i.unitPrice > 0) : [];
  const itemsSum = items.reduce((a,i)=> a + i.qty * i.unitPrice, 0);
  const rate = (typeof data.vatRate === 'number' && data.vatRate > 0 && data.vatRate < 0.3) ? data.vatRate : null;
  const warnings = Array.isArray(data.warnings) ? data.warnings.filter(w => typeof w === 'string').slice(0, 6) : [];
  const printedSubtotal = num(data.subtotal), printedTotal = num(data.grandTotal);
  const TOL = 50;
  if (printedSubtotal !== null && items.length && Math.abs(printedSubtotal - itemsSum) > TOL)
    warnings.push(`Item lines add up to ${(itemsSum/100).toFixed(2)}, but the receipt's subtotal reads ${(printedSubtotal/100).toFixed(2)} — a line may be missing.`);
  return {
    currency: data.currency || 'AED',
    country: TAX_REGIONS[data.country] ? data.country : null,
    vatIncluded: typeof data.vatIncluded === 'boolean' ? data.vatIncluded : true,
    vatRate: rate,
    merchant: data.merchant || null, date: data.date || null, time: data.time || null,
    receiptNumber: data.receiptNumber || null, paymentMethod: data.paymentMethod || null,
    warnings, items,
    subtotal: printedSubtotal ?? itemsSum,
    vat: num(data.vat) ?? 0,
    serviceCharge: num(data.serviceCharge) ?? 0,
    discount: num(data.discount) ?? 0,
    grandTotal: printedTotal ?? itemsSum,
    rawText: '', itemsSum, overallConfidence: null, engine: 'claude-api'
  };
}

const MESSAGES_ENDPOINT = 'https://api.anthropic.com/v1/messages';

/* ====================== engine C: server-side reader =====================
   Proven necessary: this frame cannot reach api.anthropic.com (TypeError:
   Failed to fetch), so the browser can never call Anthropic directly. The key
   must live on a server anyway. The app POSTs the image to an endpoint on its
   OWN origin; that endpoint holds ANTHROPIC_API_KEY and calls the Messages API.
   Nothing secret ever reaches this file.                                    */
/* Same-origin by default. The browser must never call Anthropic, and must not
   call someone else's host either — an absolute URL is rejected outright. */
const BACKEND_URL = (() => {
  const configured = (typeof window !== 'undefined' && window.SPLIT_CONFIG && window.SPLIT_CONFIG.RECEIPT_READER_URL);
  if (configured && /^https?:\/\//i.test(String(configured))) {
    try { console.warn('[reader] RECEIPT_READER_URL must be a same-origin path; ignoring', configured); } catch(_){}
    return '/api/receipt-reader';
  }
  return configured || '/api/receipt-reader';
})();
const BACKEND_FAIL = {
  UNREACHABLE:'BACKEND_UNREACHABLE',          // added by the browser
  INVALID_REQUEST:'INVALID_REQUEST', INVALID_MIME:'INVALID_MIME_TYPE',
  TOO_LARGE:'IMAGE_TOO_LARGE', INVALID_IMAGE:'INVALID_IMAGE',
  AUTH:'ANTHROPIC_AUTH_FAILED', RATE:'ANTHROPIC_RATE_LIMITED',
  REQUEST:'ANTHROPIC_REQUEST_FAILED', INVALID:'ANTHROPIC_RESPONSE_INVALID',
  PARSE:'RECEIPT_PARSE_FAILED'
};

function backendErrorToScan(code){
  switch(code){
    case BACKEND_FAIL.INVALID_MIME:
    case BACKEND_FAIL.TOO_LARGE:
    case BACKEND_FAIL.INVALID_IMAGE:
    case BACKEND_FAIL.INVALID_REQUEST:   return 'image';
    case BACKEND_FAIL.PARSE:
    case BACKEND_FAIL.INVALID:           return 'unreadable';
    case BACKEND_FAIL.RATE:              return 'timeout';
    default:                             return 'cdn';   // connection / configuration
  }
}

/** Map the backend's minimal shape onto the app's existing item model. */
function mapBackendResult(data){
  if (!data || typeof data !== 'object' || !Array.isArray(data.items))
    throw new ScanError('unreadable', BACKEND_FAIL.PARSE);
  if (data.image_present === false)
    throw new ScanError('unreadable', 'the reader reported that it saw no image');
  const cents = v => {
    if (v === null || v === undefined || v === '') return null;   // "unreadable", not zero
    const n = Number(v);
    if (!isFinite(n) || n <= 0) return null;
    // Values may arrive as 45 or 45.00 — both mean 45.00 in major units.
    return Math.round(n * 100);
  };
  const items = data.items
    .filter(i => i && i.description && !NON_ITEM.test(String(i.description)))
    .map(i => {
      const qty = clamp(Math.round(Number(i.quantity) || 1), 1, 99);   // null quantity → 1, editable
      const unit = cents(i.unit_price) ?? (cents(i.line_total) !== null ? Math.round(cents(i.line_total) / qty) : null);
      return unit === null ? null : {name: String(i.description).slice(0,60), qty, unitPrice: unit, confidence: 0.75};
    })
    .filter(Boolean);
  const itemsSum = items.reduce((a,i)=> a + i.qty * i.unitPrice, 0);
  return {
    currency:'AED', country:null, vatIncluded:true, vatRate:null,
    merchant:null, date:null, time:null, receiptNumber:null, paymentMethod:null,
    warnings:[], items,
    subtotal:itemsSum, vat:0, serviceCharge:0, discount:0, grandTotal:itemsSum,
    rawText:'', itemsSum, overallConfidence:null, engine:'backend'
  };
}

const backendProvider = {
  id:'backend', connected:!!BACKEND_URL, label:'Server-side reader',
  async extract(file, onProgress, token){
    if (!BACKEND_URL) throw new ScanError('cdn', BACKEND_FAIL.UNREACHABLE);
    ocrLog('READER_REQUEST_STARTED', BACKEND_URL);
    onProgress && onProgress('prep', 0.15, 'Preparing receipt…');
    const {canvas} = await preprocessImage(file);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
    canvas.width = 0; canvas.height = 0;
    if (token && token.cancelled) throw new CancelledError();
    const b64 = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result).split(',')[1]);
      fr.onerror = () => rej(new ScanError('image', 'could not encode the photo'));
      fr.readAsDataURL(blob);
    });
    if (!b64 || b64.length < 1000) throw new ScanError('image', 'encoded image was empty');

    onProgress && onProgress('reading', 0.45, 'Reading receipt…');
    ocrLog('IMAGE_SENT_TO_BACKEND', `${Math.round(b64.length/1024)}KB base64, image/jpeg`);
    ocrLog('ANTHROPIC_REQUEST_STARTED', 'via ' + BACKEND_URL);
    let res;
    const t0 = Date.now();
    try{
      res = await withTimeout(fetch(BACKEND_URL, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({image_base64:b64, mime_type:'image/jpeg'})
      }), RECOGNIZE_TIMEOUT_MS, 'timeout', 'backend timed out');
    }catch(e){
      if (e instanceof ScanError && e.kind === 'timeout'){ ocrLog('READER_TIMEOUT', 'backend'); throw e; }
      ocrLog('OCR_ENGINE_INIT_FAILED', BACKEND_FAIL.UNREACHABLE);
      throw new ScanError('cdn', BACKEND_FAIL.UNREACHABLE);
    }
    ocrLog('ANTHROPIC_RESPONSE_RECEIVED', `HTTP ${res.status} in ${Date.now()-t0}ms`);
    let payload = null;
    try { payload = await res.json(); } catch(_){}
    if (!res.ok || !payload || payload.ok !== true){
      const code = (payload && (payload.error || payload.code)) || (res.status >= 500 ? BACKEND_FAIL.REQUEST : BACKEND_FAIL.UNREACHABLE);
      ocrLog('OCR_ENGINE_INIT_FAILED', code);
      throw new ScanError(backendErrorToScan(code), (payload && payload.message) || code);
    }
    ocrLog('RECEIPT_JSON_RECEIVED', `${(payload.data && payload.data.items || []).length} items`);
    const mapped = mapBackendResult(payload.data);
    if (!mapped.items.length) throw new ScanError('notreceipt', 'no priced lines found in the photo');
    // Proven end to end on a real receipt — only now may the reader be READY.
    OCR_STATUS.provenRoundTrip = true;
    return mapped;
  },
  /** Configuration check only. It does NOT make the reader READY. */
  async healthCheck(){
    const res = await withTimeout(fetch(BACKEND_URL, {method:'GET'}), 15000, 'timeout', 'backend health timed out');
    if (!res.ok) throw new ScanError('cdn', BACKEND_FAIL.UNREACHABLE);
    const j = await res.json().catch(() => null);
    if (!j || j.ok !== true) throw new ScanError('cdn', BACKEND_FAIL.UNREACHABLE);
    if (j.configured === false) throw new ScanError('cdn', BACKEND_FAIL.AUTH);
    return j;
  }
};

/* ===================== READER CAPABILITY EXPERIMENT ======================
   Three mechanisms exist in principle; only measurement says which this frame
   allows. Nothing here changes the production reader — it only records facts.
     A. fetch(MESSAGES_ENDPOINT)  — Messages API shape, auth supplied by the
        runtime (this file carries no key and must never carry one).
     B. window.claude.complete(prompt) — the runtime's integrated capability,
        TEXT ONLY by its own contract: it takes a string and returns a string,
        with no content-block or image parameter.
     C. window.claude.use('sample') — the published-artifact capability.
   An image can only travel by A (or C). B cannot carry pixels at all.        */
const CAPABILITY = {
  text: null,          // true | false | null (untested)
  image: null,         // true | false | 'unsupported' | null
  mechanism: null,     // 'messages-fetch' | 'claude.complete' | null
  events: [],
  verdict: 'UNTESTED'
};
function capLog(event, detail){
  const e = {t: new Date().toISOString().slice(11,23), event, detail: detail || ''};
  CAPABILITY.events.push(e);
  try { console.info('[capability]', event, detail || ''); } catch(_){}
}

function readerMechanisms(){
  return {
    fetchAvailable: typeof fetch === 'function',
    complete: !!(window.claude && typeof window.claude.complete === 'function'),
    use: !!(window.claude && typeof window.claude.use === 'function')
  };
}

/** STEP 1 — smallest possible request. Can this frame reach a reader at all? */
async function capabilityTextTest(){
  const m = readerMechanisms();
  capLog('MECHANISMS', `fetch:${m.fetchAvailable} claude.complete:${m.complete} claude.use:${m.use}`);

  // A: Messages API shape
  if (m.fetchAvailable){
    const t0 = Date.now();
    capLog('REQUEST_STARTED', MESSAGES_ENDPOINT + ' (text ping)');
    try{
      const res = await Promise.race([
        fetch(MESSAGES_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:16,
            messages:[{role:'user', content:'Reply with exactly: READER_OK'}]})}),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timed out after 20s')), 20000))
      ]);
      capLog('REQUEST_SENT', 'awaiting response');
      const ms = Date.now() - t0;
      if (!res.ok){
        capLog('RESPONSE_RECEIVED', `HTTP ${res.status} in ${ms}ms`);
        capLog('ERROR_CODE', 'http_' + res.status);
      } else {
        const json = await res.json();
        const text = (Array.isArray(json.content) ? json.content : []).map(b => b && b.text).filter(Boolean).join(' ');
        capLog('RESPONSE_RECEIVED', `HTTP 200 in ${ms}ms`);
        capLog('RESPONSE_TIME', ms + 'ms');
        if (/READER_OK/i.test(text)){
          CAPABILITY.text = true; CAPABILITY.mechanism = 'messages-fetch';
          capLog('TEXT_HEALTH_CHECK', 'PASS via messages fetch');
          return CAPABILITY;
        }
        capLog('ERROR_MESSAGE', `unexpected reply: ${String(text).slice(0,60)}`);
      }
    }catch(e){
      capLog('ERROR_CODE', (e && e.name) || 'fetch_error');
      capLog('ERROR_MESSAGE', (e && e.message) || String(e));
    }
  }

  // B: the runtime's own text capability
  if (m.complete){
    const t0 = Date.now();
    capLog('REQUEST_STARTED', 'window.claude.complete (text ping)');
    try{
      const out = await Promise.race([
        window.claude.complete('Reply with exactly: READER_OK'),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timed out after 20s')), 20000))
      ]);
      capLog('RESPONSE_RECEIVED', `${Date.now()-t0}ms`);
      if (/READER_OK/i.test(String(out))){
        CAPABILITY.text = true; CAPABILITY.mechanism = 'claude.complete';
        CAPABILITY.image = 'unsupported';   // this mechanism takes a string, not pixels
        capLog('TEXT_HEALTH_CHECK', 'PASS via claude.complete (text-only mechanism)');
        return CAPABILITY;
      }
      capLog('ERROR_MESSAGE', `unexpected reply: ${String(out).slice(0,60)}`);
    }catch(e){
      capLog('ERROR_CODE', (e && e.name) || 'complete_error');
      capLog('ERROR_MESSAGE', (e && e.message) || String(e));
    }
  }

  CAPABILITY.text = false;
  CAPABILITY.verdict = 'ARTIFACT_READER_ENDPOINT_UNREACHABLE';
  capLog('TEXT_HEALTH_CHECK', 'FAIL — no reader mechanism answered');
  return CAPABILITY;
}

/** STEP 2 — the real uploaded photo, through the production request path. */
async function capabilityImageTest(file){
  if (CAPABILITY.text !== true){ capLog('IMAGE_HEALTH_CHECK', 'SKIPPED — text check has not passed'); return CAPABILITY; }
  if (CAPABILITY.mechanism === 'claude.complete'){
    CAPABILITY.image = 'unsupported';
    CAPABILITY.verdict = 'TEXT_ONLY_READER';
    capLog('IMAGE_HEALTH_CHECK', 'NOT SUPPORTED — claude.complete accepts a string, not image content');
    return CAPABILITY;
  }
  if (!file){ capLog('IMAGE_HEALTH_CHECK', 'SKIPPED — choose a receipt photo first'); return CAPABILITY; }

  const {canvas} = await preprocessImage(file);
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
  canvas.width = 0; canvas.height = 0;
  const base64 = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1]);
    fr.onerror = () => rej(new Error('could not encode the photo'));
    fr.readAsDataURL(blob);
  });
  capLog('IMAGE_PREPARED', `${Math.round(blob.size/1024)}KB image/jpeg, ${Math.round(base64.length/1024)}KB base64`);
  if (!base64 || base64.length < 1000){ CAPABILITY.image = false; capLog('ERROR_MESSAGE', 'encoded image empty'); return CAPABILITY; }

  const t0 = Date.now();
  capLog('REQUEST_STARTED', MESSAGES_ENDPOINT + ' (image)');
  try{
    const res = await Promise.race([
      fetch(MESSAGES_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:300,
          messages:[{role:'user', content:[
            {type:'image', source:{type:'base64', media_type:'image/jpeg', data: base64}},
            {type:'text', text:'Look at this image. Reply with ONLY JSON: {"image_present":boolean,"items":[string,string,string]} where items are the first three visible item descriptions exactly as printed. If you cannot see an image, set image_present false and items to [].'}
          ]}]})}),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timed out after 60s')), 60000))
    ]);
    capLog('REQUEST_SENT', `${Math.round(base64.length/1024)}KB of image bytes`);
    const ms = Date.now() - t0;
    if (!res.ok){
      CAPABILITY.image = false;
      capLog('RESPONSE_RECEIVED', `HTTP ${res.status} in ${ms}ms`);
      capLog('ERROR_CODE', 'http_' + res.status);
      CAPABILITY.verdict = res.status === 400 ? 'IMAGE_CONTENT_REJECTED' : 'IMAGE_REQUEST_FAILED';
      return CAPABILITY;
    }
    const json = await res.json();
    const text = (Array.isArray(json.content) ? json.content : []).map(b => b && b.text).filter(Boolean).join('\n');
    capLog('RESPONSE_RECEIVED', `HTTP 200 in ${ms}ms`);
    capLog('RESPONSE_TIME', ms + 'ms');
    CAPABILITY.reply = String(text).slice(0, 400);

    // Proof that pixels arrived: the model must report seeing an image AND
    // return content read from it. A polite "I can't see an image" fails.
    let parsed = null;
    try { parsed = JSON.parse(String(text).replace(/```json|```/g, '').trim()); } catch(_){}
    const deniesImage = /cannot see|can't see|no image|unable to view|don't see/i.test(text);
    const items = parsed && Array.isArray(parsed.items) ? parsed.items.filter(x => typeof x === 'string' && x.trim()) : [];
    if (deniesImage || (parsed && parsed.image_present === false)){
      CAPABILITY.image = false; CAPABILITY.verdict = 'IMAGE_NOT_RECEIVED_BY_MODEL';
      capLog('IMAGE_HEALTH_CHECK', 'FAIL — the model reported that it saw no image');
    } else if (items.length >= 1){
      CAPABILITY.image = true; CAPABILITY.verdict = 'IMAGE_OK';
      CAPABILITY.items = items.slice(0, 3);
      capLog('IMAGE_HEALTH_CHECK', `PASS — model read ${items.length} item description(s) from the photo`);
    } else {
      CAPABILITY.image = false; CAPABILITY.verdict = 'IMAGE_RESPONSE_UNVERIFIABLE';
      capLog('IMAGE_HEALTH_CHECK', 'FAIL — response contained no readable item text');
    }
  }catch(e){
    CAPABILITY.image = false;
    capLog('ERROR_CODE', (e && e.name) || 'fetch_error');
    capLog('ERROR_MESSAGE', (e && e.message) || String(e));
    CAPABILITY.verdict = 'IMAGE_REQUEST_FAILED';
  }
  return CAPABILITY;
}

function capabilityReport(){
  const L = ['Reader capability test', '──────────────────────'];
  L.push(`Text endpoint:  ${CAPABILITY.text === true ? 'PASS' : CAPABILITY.text === false ? 'FAIL' : 'not run'}${CAPABILITY.mechanism ? '  (' + CAPABILITY.mechanism + ')' : ''}`);
  L.push(`Image endpoint: ${CAPABILITY.image === true ? 'PASS' : CAPABILITY.image === 'unsupported' ? 'NOT SUPPORTED' : CAPABILITY.image === false ? 'FAIL' : 'not run'}`);
  L.push(`Verdict: ${CAPABILITY.verdict}`);
  if (CAPABILITY.items && CAPABILITY.items.length) L.push(`Read from the photo: ${CAPABILITY.items.join(' · ')}`);
  L.push('');
  CAPABILITY.events.slice(-18).forEach(e => L.push(`${e.t}  ${e.event}${e.detail ? '  ' + e.detail : ''}`));
  return L.join('\n');
}

async function callMessages(body, ms, note){
  const res = await withTimeout(fetch(MESSAGES_ENDPOINT, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  }), ms, 'timeout', note);
  if (!res.ok) throw new ScanError(res.status === 429 ? 'timeout' : 'cdn', `messages API HTTP ${res.status}`);
  const json = await res.json();
  return (Array.isArray(json.content) ? json.content : [])
    .map(b => (b && b.type === 'text') ? b.text : '').filter(Boolean).join('\n');
}

const anthropicProvider = {
  id:'claude-api', connected:true, label:'Claude vision (artifact runtime)',

    onProgress && onProgress('prep', 0.15, 'Preparing receipt…');

    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
    canvas.width = 0; canvas.height = 0;
    if (token && token.cancelled) throw new CancelledError();
    const base64 = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result).split(',')[1]);
      fr.onerror = () => rej(new ScanError('image', 'could not encode the photo'));
      fr.readAsDataURL(blob);
    });
    if (!base64 || base64.length < 100) throw new ScanError('image', 'encoded image was empty');
    ocrLog('IMAGE_VALIDATED', `base64 ${Math.round(base64.length/1024)}KB`);
    onProgress && onProgress('reading', 0.45, 'Reading receipt…');
    ocrLog('OCR_REQUEST_STARTED', MESSAGES_ENDPOINT);
    const text = await callMessages({
      model:'claude-sonnet-4-6', max_tokens:1000,

    }, RECOGNIZE_TIMEOUT_MS, 'reading timed out');
    ocrLog('OCR_COMPLETED', `${text.length} chars`);
    if (!text.trim()) throw new ScanError('unreadable', 'reader returned no text');
    let data;
    try { data = JSON.parse(text.replace(/```json|```/g, '').trim()); }
    catch(_){ throw new ScanError('unreadable', 'reader did not return usable data'); }
    ocrLog('TEXT_RECEIVED', 'parsed');
    onProgress && onProgress('extract', 0.95, 'Preparing your receipt…');
    return mapVisionResult(data);

  /** Cheap, real health check: one tiny round trip, no image. */
  async healthCheck(){

      messages:[{role:'user', content:'Reply with the single word OK.'}]}, 20000, 'health check timed out');
    if (!/OK/i.test(text)) throw new ScanError('unreadable', `health check replied "${text.slice(0,20)}"`);

/* The old capability-based reader has been removed.
   They sent the photo off the device, and the free flow must not: OCR is done
   entirely by Tesseract in this browser. The only remaining off-device option
   is the hosted provider below, which stays off unless explicitly configured. */

/* ---------------------- optional hosted OCR provider --------------------
   On-device Tesseract needs no key. If you'd rather use a hosted OCR service
   (faster and more accurate on hard receipts), define window.SPLIT_CONFIG in a
   script tag BEFORE this one — injected by your build from env vars:

       window.SPLIT_CONFIG = {
         OCR_PROVIDER: 'ocrspace',      // 'tesseract' (default) | 'ocrspace' | 'custom'
         OCR_API_KEY:  process.env.OCR_API_KEY,
         OCR_ENDPOINT: 'https://api.ocr.space/parse/image'   // required for 'custom'
       };

   Environment variables to provide when self-hosting:
     OCR_PROVIDER, OCR_API_KEY, OCR_ENDPOINT
   A 'custom' endpoint must accept multipart form-data with the image in the
   `file` field and return { text } or OCR.space's ParsedResults shape.
   Note: a hosted provider uploads the photo; on-device Tesseract does not.   */
const SPLIT_CONFIG = (typeof window !== 'undefined' && window.SPLIT_CONFIG) || {};

const hostedProvider = {
  id: 'hosted',
  connected: !!SPLIT_CONFIG.OCR_API_KEY,
  label: 'Hosted OCR (' + (SPLIT_CONFIG.OCR_PROVIDER || 'custom') + ')',
  async extract(file, onProgress, token){
    if (!SPLIT_CONFIG.OCR_API_KEY) throw new ScanError('cdn', 'OCR_API_KEY is not configured');
    onProgress && onProgress('prep', 0.15, 'Preparing your photo…');
    const {canvas} = await preprocessImage(file);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.82));
    canvas.width = 0; canvas.height = 0;
    if (token && token.cancelled) throw new CancelledError();
    onProgress && onProgress('reading', 0.5, 'Reading your receipt…');
    const endpoint = SPLIT_CONFIG.OCR_ENDPOINT || 'https://api.ocr.space/parse/image';
    const form = new FormData();
    form.append('file', blob, 'receipt.jpg');
    form.append('OCREngine', '2');
    form.append('scale', 'true');
    form.append('isTable', 'true');
    let res;
    try{
      res = await withTimeout(fetch(endpoint, {method:'POST', headers:{apikey: SPLIT_CONFIG.OCR_API_KEY}, body: form}),
                              RECOGNIZE_TIMEOUT_MS, 'timeout', 'hosted OCR timeout');
    }catch(e){
      if (e instanceof ScanError) throw e;
      throw new ScanError('cdn', 'hosted OCR unreachable: ' + ((e && e.message) || e));
    }
    if (!res.ok) throw new ScanError(res.status === 401 || res.status === 403 ? 'network' : 'unreadable',
                                     'hosted OCR returned HTTP ' + res.status);
    const json = await res.json();
    const text = (json.ParsedResults && json.ParsedResults[0] && json.ParsedResults[0].ParsedText) || json.text || '';
    if (!text.trim()) throw new ScanError('unreadable', 'hosted OCR returned no text');
    onProgress && onProgress('extract', 0.95, 'Preparing your receipt…');
    return parseReceipt(text.split(/\r?\n/).map(t => ({text:t.trim(), conf:null})), null);
  }
};

/* Which engine reads the photo is decided by what the page is actually
   allowed to do, not by a guess:
     - an explicit hosted configuration always wins;
     - on-device Tesseract when Web Workers are available (self-hosted, normal
       browsers) — free, private, nothing leaves the device;
     - Claude vision when workers are blocked (the embedded viewer), which is
       the only reader that can run there.
   Manual entry is always available, so no environment traps the user. */
/* Where the page is opened decides what it may do:
     - framed inside the Claude viewer → claude.use() resolves capabilities;
     - served TOP-LEVEL on the artifact's own host → window.claude exists but
       every use() resolves null BY DESIGN (per the runtime contract), so the
       vision reader cannot run there;
     - anywhere else self-hosted → no window.claude at all, but Web Workers
       work, so on-device OCR runs.
   Detecting this is what stops the app from offering a scan button that
   cannot possibly work. */
const READER = {kind:'unknown', reason:''};
let readerProbe = null;

/* Memoise the PROMISE, not a flag: a second caller must wait for the same
   answer, not read a half-filled result. */
function detectReader(){
  if (!readerProbe) readerProbe = probeReader();
  return readerProbe;
}
async function probeReader(){
  if (SPLIT_CONFIG.OCR_PROVIDER && SPLIT_CONFIG.OCR_PROVIDER !== 'tesseract' && SPLIT_CONFIG.OCR_API_KEY){
    READER.kind = 'hosted'; return READER;
  }
  if (typeof location !== 'undefined' && location.protocol === 'file:'){
    READER.kind = 'blocked'; READER.why = 'fileprotocol';
    READER.reason = 'opened as a local file (file://), where browsers block the OCR worker';
    return READER;
  }
  if (!canUseWorkers()){
    READER.kind = 'blocked'; READER.why = 'workerblocked';
    READER.reason = 'this browser view blocks Web Workers';
    return READER;
  }

  /* A source set is usable only if BOTH hold: its files exist, and a Worker can
     be constructed from its worker URL on this origin. Checking only one of the
     two is how the previous build talked itself into a doomed path — a bundled
     path that 404s constructs a worker fine, and a CDN that serves fine cannot
     be constructed from. One pass over the sets, no hopeful retries. */
  const tried = [];
  let crossOriginRefused = false;
  for (const set of OCR_SOURCE_SETS){
    const reach = await (async () => {
      try{
        const res = await Promise.race([
          fetch(set.lib, {method:'GET', cache:'force-cache'}),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timed out')), 5000))
        ]);
        if (res && res.ok === false) throw new Error('HTTP ' + res.status);
        return {ok:true};
      }catch(e){ return {ok:false, message:(e && e.message) || String(e)}; }
    })();
    // Probe the worker even when the assets failed, so the log records BOTH
    // facts — which of the two blocks a source matters when diagnosing.
    const probe = canConstructWorkerFrom(set.worker);
    if (probe.crossOrigin) crossOriginRefused = true;
    if (!reach.ok || !probe.ok){
      tried.push(`${set.name}: assets ${reach.ok ? 'ok' : 'unreachable (' + reach.message + ')'}, worker ${probe.ok ? 'ok' : 'refused (' + probe.message + ')'}`);
      continue;
    }
    OCR_SOURCES = set;
    OCR_DIAGNOSTICS.workerProbe = 'ok';
    READER.kind = 'tesseract'; READER.reason = '';
    ocrLog('READER_CAPABILITIES_OK', `assets + worker usable from ${set.name}`);
    return READER;
  }

  /* Nothing usable. In the Claude artifact sandbox this is structural, not a
     misconfiguration: the runtime serves no Worker script, WASM core or
     .traineddata on its own origin (its asset store accepts neither wasm nor
     gzip binaries), and cross-origin worker construction is refused. On-device
     Tesseract cannot run HERE. Fall through to the engine this runtime does
     support rather than rotating CDNs. */
  OCR_DIAGNOSTICS.workerProbe = tried.join(' | ');
  READER.tesseractBlocked = crossOriginRefused ? OCR_FAIL.CROSS_ORIGIN_WORKER : OCR_FAIL.LIB_LOAD;
  ocrLog('READER_INIT_FAILED', `${READER.tesseractBlocked}: ${tried.join(' | ')}`);
  /* The browser calling Anthropic directly is ruled out by measurement
     (TypeError: Failed to fetch) and by key safety. The only remaining route is
     a server-side endpoint on this app's own origin. */
  if (BACKEND_URL){
    READER.kind = 'backend';
    READER.reason = 'on-device engine cannot run here; using the server-side reader';
    return READER;
  }
  READER.kind = 'blocked'; READER.why = 'workerblocked'; READER.code = OCR_FAIL.NONE_AVAILABLE;
  return READER;
}

function providerFor(kind){
  if (kind === 'hosted') return hostedProvider;
  if (kind === 'backend') return backendProvider;    // server-side, key stays on the server
  return tesseractProvider;                           // free, on-device, the default
}

function pickProvider(){
  if (SPLIT_CONFIG.OCR_PROVIDER && SPLIT_CONFIG.OCR_PROVIDER !== 'tesseract' && SPLIT_CONFIG.OCR_API_KEY) return hostedProvider;
  return tesseractProvider;
}
let activeProvider = tesseractProvider;   // replaced at boot once the environment is known

function withTimeout(promise, ms, kind, note){
  let t;
  return Promise.race([
    promise.finally(() => clearTimeout(t)),
    new Promise((_, rej) => { t = setTimeout(() => rej(new ScanError(kind, note)), ms); })
  ]);
}

async function extractCheckFromImage(file, onProgress, token){
  if (!file) throw new ScanError('image', 'no file');
  if (!/^image\//.test(file.type)) throw new ScanError('image', 'not an image file');
  if (file.size > 20 * 1024 * 1024) throw new ScanError('image', 'over 20 MB');
  // NOTE: the cancel token was previously dropped here, so Cancel never reached
  // the provider and work carried on in the background.
  const result = await activeProvider.extract(file, onProgress, token);
  if (!result || !Array.isArray(result.items) || !result.items.length){
    // Plenty of text but no priced lines = not a receipt. Almost no text = unreadable.
    if (result && result.engine === 'claude-vision') throw new ScanError('notreceipt', 'reader found no priced lines');
    const chars = ((result && result.rawText) || '').replace(/\s/g,'').length;
    throw new ScanError(chars > 60 ? 'notreceipt' : 'unreadable', 'no items, ' + chars + ' chars');
  }
  return result;
}

/* The instruction block the user copies into any AI tool together with the
   receipt photo. Its output is exactly what the textarea below accepts. */
const AI_IMPORT_PROMPT = `Look at this receipt photo and list every item you can see.

Write one line per item, with four things separated by the | symbol:

Item name | Quantity | Item Price | Total Price

For example:

Cocktail x3 | 2 | 20.00 | 40.00
Peroni Bottle | 1 | 4.50 | 4.50
Baileys 25ml | 11 | 6.50 | 71.50

Item Price means the price of one, and Total Price means the price for that whole line.
If the receipt shows only the total for a line, divide it by the quantity to get the item price.
Only list things that were eaten or drunk. Leave out subtotal, total, tax, VAT, service charge, discount, change, cash and card lines.
Write the numbers only, with no currency symbols.
Write plain lines of text — not code. No brackets, no quotes, no programming language.
Do not guess anything you cannot read clearly.
Write nothing else before or after the list.`;

class ImportError extends Error {}

/**
 * Turns whatever an AI tool actually returned into the canonical item list.
 * The documented format is "name | qty | item price | total price", but tools
 * routinely answer with a code block, a tuple list or a comma table, so those
 * shapes are read too rather than thrown back at the user.
 */
function parseSimpleImport(text){
  const money = v => {
    const cleaned = String(v).replace(/[^0-9.-]/g, '');
    if (!cleaned) return null;
    const n = Number(cleaned);
    return isFinite(n) ? n : null;
  };
  // Scaffolding a language model wraps around an answer: fences, variable
  // assignments, imports, prints, comments, bare brackets.
  const NOISE = /^(```|~~~|#|\/\/|import\b|from\b|def\b|print\(|items\s*=|receipt\s*=|data\s*=|const\b|let\b|var\b|\[|\]|\}|\{|\)|\(|,)?\s*$/i;
  const isNoise = line =>
    /^```|^~~~/.test(line) ||
    /^(#|\/\/)/.test(line) ||
    /^(import|from|def|print|return)\b/.test(line) ||
    /^[A-Za-z_][\w]*\s*=\s*[\[\{(]?\s*$/.test(line) ||
    /^[\[\]{}()]+[,;]?$/.test(line);

  const items = [];
  const skipped = [];

  String(text).split(/\r?\n/).forEach(raw => {
    let line = raw.trim();
    if (!line) return;
    if (isNoise(line)) return;                       // scaffolding, not a failed item
    line = line.replace(/^[-*•]\s+/, '');            // bullet lists
    // A tuple or array row: ("Cocktail x3", 2, 40.00),
    const tuple = line.match(/^[\[(]\s*(.+?)\s*[\])]\s*,?;?$/);
    if (tuple) line = tuple[1];

    let parts;
    if (line.includes('|'))      parts = line.split('|');
    else if (/\t/.test(line))    parts = line.split(/\t+/);
    else if (/[""']/.test(line) || line.split(',').length >= 3) parts = line.split(',');
    else                         parts = [line];
    parts = parts.map(x => x.replace(/^["'“”]+|["'“”]+$/g, '').trim()).filter(x => x !== '');
    if (parts.length < 2){ skipped.push(raw.trim()); return; }

    const name = parts[0];
    if (/^(item name|name|description|item|qty|quantity)$/i.test(name)) return;   // header row
    const nums = parts.slice(1).map(money).filter(n => n !== null);
    if (!name || !nums.length){ skipped.push(raw.trim()); return; }

    let qty = 1, unit = null, total = null;
    if (nums.length === 1){
      total = nums[0];                                       // name + one figure = line total
    } else if (nums.length === 2){
      // "name, 2, 40.00" — quantity then line total, which is what tuple answers give.
      if (Number.isInteger(nums[0]) && nums[0] > 0 && nums[0] <= 99){ qty = nums[0]; total = nums[1]; }
      else { unit = nums[0]; total = nums[1]; }
    } else {
      qty = nums[0]; unit = nums[1]; total = nums[2];
    }
    if (!(qty > 0)){ skipped.push(raw.trim()); return; }
    items.push({name, quantity: qty, unit_price: unit, line_total: total});
  });

  if (!items.length){
    throw new ImportError(skipped.length
      ? `No item lines recognised. Each line needs: name | quantity | item price | total price. First unreadable line: "${skipped[0].slice(0,60)}"`
      : 'Nothing to import — paste the list your AI tool produced.');
  }
  return {receipt: {currency: null, items, subtotal: null, tax: null, total: null}, _skipped: skipped};
}

const isNum = v => typeof v === 'number' && isFinite(v);
const numOrNull = (v, label) => {
  if (v === null || v === undefined) return null;
  if (!isNum(v)) throw new ImportError(`${label} must be a number or null (got ${typeof v === 'string' ? 'a string' : typeof v}).`);
  return v;
};

/**
 * Canonical import JSON  →  the extraction shape every reader produces.
 * Validates strictly and NEVER silently corrects a value: a disagreement
 * between line_total and quantity × unit_price is reported as a warning on the
 * review screen, with both numbers left exactly as given.
 */
function normalizeImportedReceipt(raw){
  let parsed;
  let skippedLines = [];
  if (typeof raw === 'string'){
    if (!raw.trim()) throw new ImportError('Paste the list from your AI tool first.');
    // The simple "name | qty | price | total" list is the documented format;
    // JSON is still accepted for anything already in that shape.
    const looksJson = /^\s*(```(?:json)?\s*)?\{/.test(raw);
    if (!looksJson){
      const simple = parseSimpleImport(raw);
      skippedLines = simple._skipped || [];
      parsed = {receipt: simple.receipt};
    } else {
      // AI tools routinely wrap JSON in fences. Removing the wrapper is not
      // altering data — every value inside is still parsed exactly as given.
    let text = raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();
    try { parsed = JSON.parse(text); }
    catch(e){ throw new ImportError(`That isn't valid JSON — ${(e && e.message) || 'check the brackets and commas'}.`); }
    }
  } else parsed = raw;

  if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new ImportError('The top level must be an object.');
  const r = parsed.receipt;
  if (!r || typeof r !== 'object' || Array.isArray(r)) throw new ImportError('Missing a "receipt" object at the top level.');
  if (!Array.isArray(r.items)) throw new ImportError('"receipt.items" must be an array.');
  if (!r.items.length) throw new ImportError('"receipt.items" is empty — there is nothing to import.');
  if (r.currency !== null && r.currency !== undefined && typeof r.currency !== 'string')
    throw new ImportError('"receipt.currency" must be a string or null.');

  const subtotal = numOrNull(r.subtotal, '"receipt.subtotal"');
  const tax      = numOrNull(r.tax,      '"receipt.tax"');
  const total    = numOrNull(r.total,    '"receipt.total"');

  const warnings = [];
  const items = r.items.map((item, idx) => {
    const at = `Item ${idx + 1}`;
    if (!item || typeof item !== 'object' || Array.isArray(item)) throw new ImportError(`${at} is not an object.`);
    if (typeof item.name !== 'string' || !item.name.trim()) throw new ImportError(`${at} needs a "name".`);
    if (!isNum(item.quantity) || item.quantity <= 0) throw new ImportError(`${at} ("${item.name}") needs a numeric "quantity" greater than 0.`);
    const unit = numOrNull(item.unit_price, `${at} ("${item.name}") "unit_price"`);
    const line = numOrNull(item.line_total, `${at} ("${item.name}") "line_total"`);
    if (unit === null && line === null) throw new ImportError(`${at} ("${item.name}") needs either "unit_price" or "line_total".`);

    const qty = Math.round(item.quantity);
    if (qty !== item.quantity) warnings.push(`${item.name}: quantity ${item.quantity} was read as ${qty} whole units.`);
    // Derive only what is missing. Nothing supplied is ever overwritten.
    const unitCents = unit !== null ? Math.round(unit * 100) : Math.round((line * 100) / qty);
    if (unit !== null && line !== null && Math.abs(Math.round(line * 100) - unitCents * qty) > 1)
      warnings.push(`${item.name}: line_total ${line.toFixed(2)} doesn't equal quantity × unit_price (${(unitCents * qty / 100).toFixed(2)}). Both values were kept as given.`);
    if (NON_ITEM.test(item.name))
      warnings.push(`"${item.name}" looks like a total or charge line rather than an item — delete it below if so.`);
    return {name: item.name.trim().slice(0, 60), qty, unitPrice: unitCents, confidence: 1};
  });

  skippedLines.slice(0, 3).forEach(l => warnings.push(`Ignored a line that wasn't in the item format: "${l.slice(0, 50)}"`));
  const itemsSum = items.reduce((a, i) => a + i.qty * i.unitPrice, 0);
  const subCents = subtotal !== null ? Math.round(subtotal * 100) : null;
  if (subCents !== null && Math.abs(subCents - itemsSum) > 50)
    warnings.push(`The items add up to ${(itemsSum/100).toFixed(2)} but "subtotal" says ${subtotal.toFixed(2)}. Nothing was changed.`);

  // Exactly the shape a reader returns — no new model, no new maths.
  return {
    currency: r.currency || 'AED',
    country: null,
    vatIncluded: state.check.vatIncluded,     // the user's existing tax setting is untouched
    vatRate: null,
    merchant: typeof r.merchant === 'string' ? r.merchant : null,
    date: typeof r.date === 'string' ? r.date : null,
    time: null, receiptNumber: null, paymentMethod: null,
    warnings, items,
    subtotal: subCents ?? itemsSum,
    vat: tax !== null ? Math.round(tax * 100) : 0,
    serviceCharge: 0, discount: 0,
    grandTotal: total !== null ? Math.round(total * 100) : (subCents ?? itemsSum),
    rawText: '', itemsSum, overallConfidence: null, engine: 'manual-import'
  };
}

/* ------------------------------ app actions ----------------------------- */
/* Back is derived from the actual position in the flow — including the two
   sub-views of the Check screen — so there is no screen without an exit and no
   loop. State is never reset by navigating; only the view changes. */
function backTarget(){
  if (state.step === 'summary') return {step:'assign'};
  if (state.step === 'assign')  return {step:'check', checkView:'review'};
  if (state.step === 'check')   return state.ui.checkView === 'review' ? {step:'check', checkView:'import'} : {step:'people'};
  if (state.step === 'people')  return {step:'start'};
  return null;                                  // start screen: nothing behind it
}
function goBack(){
  const t = backTarget();
  if (!t) return;
  if (t.checkView) state.ui.checkView = t.checkView;
  setStep(t.step);
}
function setStep(step, fromHistory){
  state.step = step;
  render();
  if (!fromHistory){
    try { history.pushState({step, checkView: state.ui.checkView}, ''); } catch(_){}
  }
  window.scrollTo({top:0, behavior:'instant'});
}
function addPerson(name){
  const n = (name||'').trim();
  if (!n) return toast('Type a name first.', true);
  if (state.check.people.some(p => p.name.toLowerCase() === n.toLowerCase())) return toast(`${n} is already in the group.`, true);
  state.check.people.push({id:uid('p'), name:n});
  state.ui.nameDraft = '';
  render();
  const inp = document.getElementById('person-input'); if (inp){ inp.value=''; inp.focus(); }
}
function removePerson(id){
  state.check.people = state.check.people.filter(p => p.id !== id);
  state.check.items.forEach(item => {
    item.people = (item.people||[]).filter(pid => pid !== id);
    if (item.units) delete item.units[id];
    if (item.custom && item.custom.values) delete item.custom.values[id];
  });
  render();
}
function applyExtraction(data, source){
  const c = state.check;
  // The receipt's currency is recorded, but it does NOT choose the country:
  // the tax configuration comes from the country setting the user controls.
  // Currency comes from the country setting, never from imported data — that
  // is what made an AED receipt override an Egypt check.
  c.currency = currencyOf(c);
  c.vatIncluded  = data.vatIncluded !== undefined ? data.vatIncluded : c.vatIncluded;
  // An explicitly printed rate ("VAT 14%") is preferred over the country default,
  // shown in the UI, and reversible with one tap.
  c.vatRateOverride = (typeof data.vatRate === 'number' && data.vatRate > 0 && data.vatRate < 0.3) ? data.vatRate : null;
  // A country the receipt itself identifies is a suggestion worth taking; the
  // user can still change it, and currency alone never decides it.
  if (data.country && TAX_REGIONS[data.country] && !data.vatRate) c.country = data.country;
  // A charge printed on the receipt switches its setting on, at the receipt's value.
  if (data.serviceCharge) c.serviceCharge = {enabled:true, mode:'amount', value:data.serviceCharge};
  if (data.discount)      c.discount      = {enabled:true, mode:'amount', value:data.discount};
  c.items = data.items.map(i => newItem({
    name: i.name || '', qty: i.qty || 1, unitPrice: i.unitPrice || 0,
    mode: (i.qty || 1) > 1 ? 'units' : 'people',   // multi-quantity lines are assigned per unit
    flagged: (i.confidence ?? 1) < 0.6
  }));
  // The VAT line printed on the receipt is only used to guess the toggle above.
  // It is never added as a charge — the app's own VAT setting is the one truth.
  c.merchant = data.merchant || c.merchant || null;
  c.receiptMeta = {time: data.time || null, receiptNumber: data.receiptNumber || null,
                   paymentMethod: data.paymentMethod || null, warnings: data.warnings || []};
  c.date     = data.date || c.date || null;
  // Printed values are preserved verbatim for reconciliation — never used to
  // overwrite the computed figures.
  c.scan = {
    rawText: data.rawText || '', itemsSum: data.itemsSum || 0,
    printed: {
      subtotal: data.subtotal || 0, discount: data.discount || 0,
      serviceCharge: data.serviceCharge || 0, vat: data.vat || 0,
      grandTotal: data.grandTotal || 0, vatRate: data.vatRate || null
    },
    printedTotal: data.grandTotal || 0, printedVat: data.vat || 0,
    confidence: data.overallConfidence
  };
  c.source = source || 'ocr';
  state.ui.checkView = 'review';
  render();
}

function PersonSelector(item){
  const people = state.check.people;
  const res = allocateItem(item, people);

  // Quantity mode: one tap = one unit, and the app never lets more units out
  // the door than the line actually has.
  if (item.mode === 'units'){
    const left = remainingUnits(item);
    const chips = people.map(p => {
      const n = unitsFor(item, p.id);
      const full = left === 0;
      return `<span class="chip ${n?'':'chip-quiet'}" style="${n?'background:var(--accent);border-color:var(--accent);color:var(--accent-ink)':''}; padding-right:${n?'6px':'13px'}">
        <button class="chipbtn" data-act="add-unit" data-item="${item.id}" data-person="${p.id}" ${full?'disabled':''}
          aria-label="Assign one ${esc(item.name||'item')} to ${esc(p.name)}${full?' (none left)':''}">${esc(p.name)}${n?` × ${n}`:''}</button>
        ${n ? `<button class="chipbtn minus" data-act="remove-unit" data-item="${item.id}" data-person="${p.id}"
          aria-label="Take one ${esc(item.name||'item')} back from ${esc(p.name)}">−</button>` : ''}
      </span>`;
    }).join('');
    return `<div class="stack-sm">
      <div class="between tiny">
        <span style="font-weight:600; color:${left?'var(--accent)':'var(--success)'}">
          ${left ? `${left} of ${item.qty} still to assign` : `All ${item.qty} assigned`}</span>
        <span class="dim">${money(item.unitPrice)} each</span>
      </div>
      <div class="chips">${chips}</div>
      <div class="row" style="gap:10px">
        <button class="linkbtn tiny" data-act="units-everyone" data-item="${item.id}" style="padding-left:0">Spread evenly</button>
        <button class="linkbtn tiny" data-act="units-clear" data-item="${item.id}">Clear</button>
        <button class="linkbtn tiny" data-act="mode-share" data-item="${item.id}">Share the whole line instead</button>
      </div>
    </div>`;
  }

  const everyone = item.mode === 'everyone';
  const share = (everyone && people.length) ? Math.round(lineTotal(item)/people.length)
               : (item.mode==='people' && item.people.length ? Math.round(lineTotal(item)/item.people.length) : null);
  const chips = people.map(p => {
    const on = everyone || (item.mode==='people' && item.people.includes(p.id)) || (item.mode==='custom' && res.map[p.id] > 0);
    const amount = res.map[p.id];
    return `<button class="chip" role="button" aria-pressed="${on}" data-act="toggle-person" data-item="${item.id}" data-person="${p.id}">
      <span class="tick"></span>${esc(p.name)}${on && amount ? ` <span class="tiny" style="opacity:.75">${plain(amount)}</span>` : ''}
    </button>`;
  }).join('');
  return `<div class="stack-sm">
    <div class="chips">
      <button class="chip everyone" aria-pressed="${everyone}" data-act="toggle-everyone" data-item="${item.id}"><span class="tick"></span>Everyone</button>
      ${chips}
      <button class="chip" data-act="open-custom" data-item="${item.id}" aria-pressed="${item.mode==='custom'}">Custom…</button>
    </div>
    ${share !== null && (everyone ? people.length>1 : item.people.length>1)
      ? `<div class="tiny" style="color:var(--accent); font-weight:600">${money(share)} each</div>` : ''}
    ${item.qty > 1 ? `<button class="linkbtn tiny" data-act="mode-units" data-item="${item.id}" style="padding-left:0">Split the ${item.qty} units between people</button>` : ''}
  </div>`;
}

function StatusTag(item){
  const s = itemStatus(item);
  const map = {assigned:['tag-ok','Assigned'], shared:['tag-ok', s.label], unassigned:['tag-warn','Unassigned'], invalid:['tag-err', s.label]};
  const [cls, label] = map[s.kind];
  const mark = s.kind==='invalid' ? '!' : s.kind==='unassigned' ? '•' : '✓';
  return `<span class="tag ${cls}"><span aria-hidden="true">${mark}</span>${esc(label)}</span>`
       + (s.detail ? `<div class="tiny" style="color:${s.kind==='invalid'?'var(--danger)':'var(--muted)'}; margin-top:6px">${esc(s.detail)}</div>` : '');
}

      ${err && err.detail ? `<div class="tiny dim">Technical detail: ${esc(err.detail)}</div>` : ''}` : ''}
  </div>`;
}

function formatDiagnostics(d){
  const lines = ['OCR Engine', '──────────────'];
  (d.checks || []).forEach(c => lines.push(`${c.ok ? '✓' : '✗'}  ${c.name}${c.reason ? '\n     ' + c.reason : ''}`));
  if (!(d.checks || []).length) lines.push('Run the checks to see what this browser allows.');
  lines.push('');
  lines.push(`OCR STATUS: ${OCR_STATUS.state === 'ready' ? 'READY' : 'NOT READY'}${OCR_STATUS.engine ? '  (engine: ' + OCR_STATUS.engine + ')' : ''}`);
  if (OCR_STATUS.state !== 'ready' && OCR_STATUS.code) lines.push(`   ${OCR_STATUS.code}`);
  if (OCR_STATUS.state !== 'ready' && OCR_STATUS.reason) lines.push(`   ${OCR_STATUS.reason}`);
  (d.attempts || []).forEach(a => lines.push(`${a.ok ? '✓' : '✗'}  worker attempt: ${a.config}${a.error ? '\n     ' + a.error : ''}`));
  if (d.log && d.log.length){
    lines.push('');
    d.log.slice(-10).forEach(e => lines.push(`+${e.t}ms  ${e.event}${e.detail ? '  ' + e.detail : ''}`));
  }
  return lines.join('\n');
}
