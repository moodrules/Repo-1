<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally — split the bill, to the fils</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F5; --surface-3:#FAFAFA;
  --border:#E5E5E5; --border-strong:#D6D6D6;
  --text:#111111; --text-2:#222222; --muted:#6E6E6E; --faint:#9A9A9A;
  --accent:#FF6B00; --accent-ink:#FFFFFF; --accent-soft:#FFF2E8; --accent-line:#FFD2AF;
  --success:#12805C; --success-soft:#E8F5F0;
  --danger:#C8402C; --danger-soft:#FDEDEA;
  --shadow-sm:0 1px 2px rgba(17,17,17,.05);
  --shadow-md:0 2px 4px rgba(17,17,17,.04), 0 12px 28px rgba(17,17,17,.07);
  --radius:16px; --radius-sm:12px; --radius-lg:22px;
  --maxw:560px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E0E; --surface:#161616; --surface-2:#1E1E1E; --surface-3:#141414;
    --border:#2A2A2A; --border-strong:#3A3A3A;
    --text:#F6F6F6; --text-2:#E4E4E4; --muted:#A3A3A3; --faint:#7C7C7C;
    --accent:#FF7A1A; --accent-ink:#151515; --accent-soft:#2C1A0B; --accent-line:#5A3413;
    --success:#3ECF97; --success-soft:#12271F;
    --danger:#FF7A66; --danger-soft:#2A1512;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    --shadow-md:0 2px 4px rgba(0,0,0,.4), 0 12px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#161616; --surface-2:#1E1E1E; --surface-3:#141414;
  --border:#2A2A2A; --border-strong:#3A3A3A;
  --text:#F6F6F6; --text-2:#E4E4E4; --muted:#A3A3A3; --faint:#7C7C7C;
  --accent:#FF7A1A; --accent-ink:#151515; --accent-soft:#2C1A0B; --accent-line:#5A3413;
  --success:#3ECF97; --success-soft:#12271F;
  --danger:#FF7A66; --danger-soft:#2A1512;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1, "lnum" 1;
}
button{font:inherit; color:inherit}
input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0; letter-spacing:-.02em; line-height:1.15}
p{margin:0}

/* ---------- layout ---------- */
.shell{max-width:var(--maxw); margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; position:relative}
@media (min-width:900px){
  body{background:var(--surface-3)}
  .shell{background:var(--bg); border-left:1px solid var(--border); border-right:1px solid var(--border); max-width:620px}
}
.pane{flex:1; padding:20px 18px 24px; display:flex; flex-direction:column; gap:18px}
.footer{position:sticky; bottom:0; z-index:5; background:linear-gradient(to bottom, transparent, var(--bg) 22%); padding:14px 18px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px}
.footer-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-sm)}

/* ---------- stepper ---------- */
.stepbar{position:sticky; top:0; z-index:6; background:var(--bg); border-bottom:1px solid var(--border); padding:12px 18px calc(12px); display:flex; align-items:center; gap:12px}
.steps{display:none; gap:6px; flex:1}
.step{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:500; color:var(--faint)}
.step .dot{width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:700; background:var(--surface-2); color:var(--muted)}
.step.done{color:var(--text)} .step.done .dot{background:var(--text); color:var(--bg)}
.step.now{color:var(--accent)} .step.now .dot{background:var(--accent); color:var(--accent-ink)}
.step .sep{color:var(--border-strong); margin-left:4px}
.stepmini{flex:1; display:flex; flex-direction:column; gap:7px}
.stepmini .row{display:flex; justify-content:space-between; font-size:13px; font-weight:600}
.stepmini .row span:last-child{color:var(--muted); font-weight:500}
.track{height:4px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.track i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .3s cubic-bezier(.2,.8,.2,1)}
@media (min-width:560px){ .steps{display:flex} .stepmini{display:none} }
.backlink{background:none; border:0; padding:6px 8px 6px 0; cursor:pointer; color:var(--muted); font-size:14px; font-weight:500; display:flex; align-items:center; gap:4px}
.backlink:hover{color:var(--text)}

/* ---------- type ---------- */
.title{font-size:28px; font-weight:700; letter-spacing:-.03em}
.sub{color:var(--muted); font-size:15px; margin-top:6px}
.section-title{font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.01em}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:14px; border:1px solid transparent; padding:14px 18px; font-weight:600; font-size:16px; cursor:pointer; background:var(--surface-2); color:var(--text); transition:transform .08s ease, background .15s ease, border-color .15s ease}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:0 6px 16px rgba(255,107,0,.22)}
.btn-primary:hover:not([disabled]){background:#F06200}
.btn-dark{background:var(--text); color:var(--bg)}
.btn-ghost{background:transparent; border-color:var(--border); color:var(--text)}
.btn-ghost:hover{border-color:var(--border-strong); background:var(--surface-2)}
.btn-block{width:100%}
.btn-sm{padding:9px 13px; font-size:14px; border-radius:11px}
.btn-icon{width:38px; height:38px; padding:0; border-radius:11px; background:transparent; border:1px solid var(--border); display:grid; place-items:center; cursor:pointer}
.btn-icon:hover{background:var(--surface-2)}
.linkbtn{background:none; border:0; color:var(--accent); font-weight:600; cursor:pointer; padding:8px; font-size:15px}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px}
.card-flat{background:var(--surface-2); border:1px solid transparent}
.stack{display:flex; flex-direction:column; gap:12px}
.stack-sm{display:flex; flex-direction:column; gap:8px}
.row{display:flex; align-items:center; gap:10px}
.between{display:flex; align-items:center; justify-content:space-between; gap:10px}
.grow{flex:1; min-width:0}
.hr{height:1px; background:var(--border); border:0; margin:2px 0}

/* ---------- inputs ---------- */
.field{display:flex; flex-direction:column; gap:6px}
.label{font-size:13px; font-weight:600; color:var(--muted)}
.input{width:100%; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 14px; font-size:16px; transition:border-color .15s ease, box-shadow .15s ease}
.input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none}
.input-bare{border:0; background:transparent; padding:6px 0; font-weight:600; font-size:16px; width:100%}
.input-bare:focus{outline:none; box-shadow:inset 0 -2px 0 var(--accent)}
.input-num{text-align:right; font-variant-numeric:tabular-nums}
.money-wrap{display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid transparent; border-radius:11px; padding:6px 10px}
.money-wrap:focus-within{border-color:var(--accent); background:var(--surface)}
.money-wrap .cur{font-size:12px; font-weight:700; color:var(--muted)}
.money-wrap input{border:0; background:transparent; width:100%; text-align:right; font-weight:600; font-variant-numeric:tabular-nums}
.money-wrap input:focus{outline:none}

/* segmented */
.seg{display:flex; background:var(--surface-2); border-radius:13px; padding:4px; gap:4px}
.seg button{flex:1; border:0; background:transparent; border-radius:10px; padding:10px 8px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; transition:background .15s, color .15s}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm)}
.seg.accent button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); box-shadow:none}

/* ---------- people ---------- */
.avatar{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:14px; background:var(--surface-2); color:var(--text); flex:none; border:1px solid var(--border)}
.person-row{display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--surface); border:1px solid var(--border); border-radius:14px}
.person-row .name{flex:1; min-width:0}
.count-pill{display:inline-flex; align-items:center; gap:7px; background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line); padding:6px 12px; border-radius:99px; font-size:13px; font-weight:600}

/* chips */
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{display:inline-flex; align-items:center; gap:6px; border-radius:99px; border:1px solid var(--border); background:var(--surface); padding:8px 13px; font-size:14px; font-weight:600; cursor:pointer; transition:all .12s ease}
.chip:hover{border-color:var(--border-strong)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.chip.everyone[aria-pressed="true"]{background:var(--text); border-color:var(--text); color:var(--bg)}
.chip .tick{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.0}
.chip[aria-pressed="true"] .tick{opacity:1}
.chipbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;font-weight:600}
.chipbtn[disabled]{opacity:.45;cursor:not-allowed}
.chipbtn.minus{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;line-height:1}
.chip-quiet{background:var(--surface-2); border-color:transparent; font-weight:500; cursor:default}

/* status */
.tag{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:4px 9px; border-radius:8px}
.tag-ok{background:var(--success-soft); color:var(--success)}
.tag-warn{background:var(--accent-soft); color:var(--accent)}
.tag-err{background:var(--danger-soft); color:var(--danger)}
.tag-neutral{background:var(--surface-2); color:var(--muted)}

/* item cards */
.item{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; display:flex; flex-direction:column; gap:12px; animation:pop .28s cubic-bezier(.2,.8,.2,1) both}
.item.flagged{border-color:var(--accent-line); background:linear-gradient(var(--accent-soft), var(--accent-soft)) padding-box}
.item-head{display:flex; align-items:flex-start; gap:10px}
.item-name{font-weight:600; font-size:16px; letter-spacing:-.01em}
.item-meta{font-size:13px; color:var(--muted)}
.amount{font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.amount-lg{font-size:22px}
.qty-step{display:flex; align-items:center; gap:2px; background:var(--surface-2); border-radius:11px; padding:3px}
.qty-step button{width:30px; height:30px; border:0; background:transparent; border-radius:8px; cursor:pointer; font-weight:700; color:var(--muted)}
.qty-step button:hover{background:var(--surface); color:var(--text)}
.qty-step span{min-width:24px; text-align:center; font-weight:600; font-variant-numeric:tabular-nums}

/* dropzone */
.drop{border:1.5px dashed var(--border-strong); border-radius:var(--radius-lg); padding:26px 20px; text-align:center; background:var(--surface-3); cursor:pointer; transition:border-color .15s, background .15s}
.drop:hover,.drop.over{border-color:var(--accent); background:var(--accent-soft)}
.drop .ic{width:52px; height:52px; border-radius:16px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; margin:0 auto 12px}
.thumb{width:100%; max-height:190px; object-fit:cover; border-radius:14px; border:1px solid var(--border)}

/* bars */
.bar{height:10px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s cubic-bezier(.2,.8,.2,1)}

/* sheet */
.backdrop{position:fixed; inset:0; background:rgba(10,10,10,.42); backdrop-filter:blur(2px); z-index:40; animation:fade .18s ease both}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--bg); border-radius:24px 24px 0 0; border-top:1px solid var(--border); max-height:88dvh; overflow:auto; padding:8px 18px calc(20px + env(safe-area-inset-bottom)); animation:up .26s cubic-bezier(.2,.8,.2,1) both; box-shadow:var(--shadow-md)}
@media (min-width:640px){ .sheet{left:50%; transform:translateX(-50%); width:min(560px,94vw); bottom:16px; border-radius:24px; border:1px solid var(--border)} @keyframes up{from{opacity:0; transform:translate(-50%,16px)} to{opacity:1; transform:translate(-50%,0)}} }
.grabber{width:38px; height:4px; border-radius:99px; background:var(--border-strong); margin:8px auto 14px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom)); z-index:60; background:var(--text); color:var(--bg); padding:12px 16px; border-radius:13px; font-size:14px; font-weight:500; max-width:min(420px,92vw); box-shadow:var(--shadow-md); animation:up .2s ease both}
.toast.bad{background:var(--danger); color:#fff}

/* empty */
.empty{text-align:center; padding:34px 20px; border:1px dashed var(--border); border-radius:var(--radius-lg); background:var(--surface-3)}
.empty h3{font-size:17px; margin-bottom:6px}
.empty p{color:var(--muted); font-size:14px; margin-bottom:14px}

.notice{display:flex; gap:10px; padding:12px 14px; border-radius:14px; font-size:13.5px; line-height:1.4}
.notice-info{background:var(--surface-2); color:var(--muted)}
.notice-warn{background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line)}
.notice-warn b{color:inherit}
.notice code{font-size:12.5px; background:rgba(0,0,0,.06); padding:1px 5px; border-radius:5px}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
@keyframes fade{from{opacity:0} to{opacity:1}}
@keyframes up{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important}}
.credit{padding:18px 18px calc(22px + env(safe-area-inset-bottom)); text-align:center; font-size:12.5px; color:var(--faint); letter-spacing:.01em}
.credit b{font-weight:600; color:var(--muted)}
.brand{display:inline-flex; align-items:center; gap:10px; margin-bottom:26px}
.brand-mark{width:38px; height:38px; border-radius:12px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; box-shadow:0 6px 16px rgba(255,107,0,.25)}
.brand-name{font-weight:700; font-size:20px; letter-spacing:-.03em}
.hero{font-size:clamp(36px,10vw,50px); font-weight:700; letter-spacing:-.045em; line-height:1.02}
.hero-accent{color:var(--accent)}
.step-num{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700;
  background:var(--accent-soft); border:1px solid var(--accent-line); color:var(--accent); flex:none}
.hero-num{font-size:clamp(40px,12vw,58px); font-weight:700; letter-spacing:-.045em; line-height:1}
.dim{color:var(--muted)}
.tiny{font-size:12.5px}
.scroller{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.mini-person{flex:none; display:flex; flex-direction:column; gap:1px; background:var(--surface-2); border-radius:12px; padding:8px 12px; min-width:92px}
.mini-person b{font-size:14px; font-weight:600}
.mini-person span{font-size:13px; font-variant-numeric:tabular-nums; color:var(--accent); font-weight:700}
.mini-person.zero span{color:var(--muted)}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script>
"use strict";
/* =========================================================================
   Split — a check-splitting app
   Layers:  data model -> calculation engine -> OCR adapter -> UI components
   ========================================================================= */

/* On-device reading is switched on by the presence of the engine, not by a
   hand-set flag. At boot the app asks its OWN origin for the worker script
   (vendor/tesseract/worker.min.js, fetched at deploy time by setup.sh). If it
   is there, the reading UI turns on and the engine is proved with a real smoke
   test before the user taps anything; if it is not — a bare file:// open, or
   the artifact frame, where no engine can read pixels — the UI stays off and
   the photo hand-off path below is used instead. Nothing is ever claimed ready
   on the strength of a flag. window.SPLIT_CONFIG.OCR_UI forces either way. */
let OCR_UI_ENABLED = false;

async function detectLocalEngine(){
  try{
    const cfg = (typeof window !== 'undefined' && window.SPLIT_CONFIG) || {};
    if (typeof cfg.OCR_UI === 'boolean') return cfg.OCR_UI;
    if (typeof location === 'undefined' || !/^https?:$/.test(location.protocol)) return false;
    const r = await fetch(OCR_SOURCE_SETS[0].worker, {method:'GET', cache:'force-cache'});
    if (!r || !r.ok) return false;
    // A single-page host answering every path with index.html would pass a
    // status check and fail later, so confirm it is script, not markup.
    const type = (r.headers.get('content-type') || '').toLowerCase();
    return type.includes('javascript') || type.includes('ecmascript');
  }catch(_){ return false; }
}
/* Scan and Upload are live again, but what they do is capture the photo and
   hand it off: this frame has no engine that can read pixels (measured over
   many rounds), so the photo goes to Claude in chat, which transcribes it and
   returns a list to paste back. The capture, preview and import steps are the
   app's; only the reading happens outside it. */
const PHOTO_CAPTURE_ENABLED = true;

/* ------------------------------ utilities ------------------------------ */
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2,9);
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const delay = ms => new Promise(r => setTimeout(r, ms));

// Money is stored as integer minor units (fils/cents) everywhere internally.
const toCents = v => Math.round((Number(v) || 0) * 100);
const parseMoney = str => {
  if (str === '' || str == null) return null;
  const cleaned = String(str).replace(/[^0-9.,-]/g,'').replace(/,/g,'');
  const n = Number(cleaned);
  return Number.isFinite(n) ? Math.round(n * 100) : null;
};
const money = (cents, cur) => `${cur || currencyOf(state.check)} ${(cents/100).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2})}`;
const plain = cents => (cents/100).toFixed(2);
const initials = name => (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';

/**
 * Deterministic largest-remainder allocation.
 * Splits `total` (integer minor units) across `weights`, guaranteeing the parts
 * sum back to exactly `total`. Leftover minor units go to the largest fractional
 * remainders first, ties broken by index — so results are stable and reproducible.
 */
function allocate(total, weights){
  const n = weights.length;
  if (!n) return [];
  const sum = weights.reduce((a,b)=>a+b, 0);
  if (sum <= 0) return weights.map(()=>0);
  const exact  = weights.map(w => total * w / sum);
  const parts  = exact.map(v => Math.floor(v));
  let remainder = total - parts.reduce((a,b)=>a+b, 0);
  const order = exact.map((v,i)=>({i, frac: v - Math.floor(v)})).sort((a,b)=> b.frac - a.frac || a.i - b.i);
  let k = 0;
  while (remainder !== 0 && order.length){
    const idx = order[k % order.length].i;
    parts[idx] += remainder > 0 ? 1 : -1;
    remainder  += remainder > 0 ? -1 : 1;
    k++;
  }
  return parts;
}

/* ------------------------------ data model ----------------------------- */
/*
  Check
   ├── country, currency, vatRateOverride, vatIncluded
   ├── people[]  { id, name }
   ├── items[]   { id, name, qty, unitPrice, mode, people[], custom{unit,values}, flagged }
   ├── serviceCharge { mode:'percent'|'amount', value }
   └── discount      { mode:'percent'|'amount', value }
  mode: 'people'  -> equal split across selected people
        'everyone'-> equal split across the whole group (recalculates if group changes)
        'custom'  -> explicit amounts or percentages per person
*/
/* --------------------------- tax regions -------------------------------
   The VAT rate belongs to the country, never to the currency and never to a
   constant in the engine. Adding a country is one entry here — no calculation
   code changes. `decimals` is carried so a 3-decimal currency (KWD, BHD) can
   be added later without touching the rounding logic.                      */
const TAX_REGIONS = {
  EG: {code:'EG', name:'Egypt',                 short:'Egypt',  currency:'EGP', vatRate:0.14, vatLabel:'VAT', decimals:2},
  AE: {code:'AE', name:'United Arab Emirates',  short:'UAE',    currency:'AED', vatRate:0.05, vatLabel:'VAT', decimals:2},
  SA: {code:'SA', name:'Saudi Arabia',          short:'Saudi',  currency:'SAR', vatRate:0.15, vatLabel:'VAT', decimals:2},
  XX: {code:'XX', name:'Other / Custom',        short:'Other',  currency:'USD', vatRate:0.00, vatLabel:'Sales tax', decimals:2, custom:true}
};
const DEFAULT_REGION = 'AE';
const taxRegion = c => TAX_REGIONS[c && c.country] || TAX_REGIONS[DEFAULT_REGION];
/** Effective rate: an explicitly extracted receipt rate wins, else the country's. */
const vatRateOf = c => (typeof c.vatRateOverride === 'number' && c.vatRateOverride >= 0) ? c.vatRateOverride : taxRegion(c).vatRate;
const vatPct = c => +(vatRateOf(c) * 100).toFixed(2);
/* The currency belongs to the country. Only "Other / Custom" takes a typed
   code — nothing else (an import, a reader, a receipt) may change it. */
function currencyOf(c){
  const reg = taxRegion(c);
  if (reg.custom) return (c.customCurrency || reg.currency || 'USD').toUpperCase();
  return reg.currency;
}
function syncCurrency(){ state.check.currency = currencyOf(state.check); }

const STEPS = ['people','check','assign','summary'];
const STORAGE_KEY = 'split.check.v1';

function newItem(partial={}){
  return { id: uid('item'), name:'', qty:1, unitPrice:0,
           mode:'people',            // 'people' (share a line) | 'units' (per-person quantities) | 'everyone' | 'custom'
           people:[],                // share mode: who splits the line equally
           units:{},                 // units mode: { personId: unitsAssigned }
           custom:{unit:'amount', values:{}}, flagged:false, ...partial };
}
function newCheck(){
  return {
    country: DEFAULT_REGION,
    currency: TAX_REGIONS[DEFAULT_REGION].currency,
    vatRateOverride: null,          // set only when a receipt states its own rate
    vatIncluded: true,
    people:[], items:[],
    serviceCharge:{enabled:false, mode:'percent', value:10},
    discount:{enabled:false, mode:'percent', value:10},
    merchant:null, date:null, ocrLang:null, customCurrency:null, scan:null, source:null
  };
}
let state = {
  step:'start',
  check:newCheck(),
  ui:{ checkView:'import', importing:false, preview:null, sheet:null, nameDraft:'', showCharges:false }
};

function persist(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({step:state.step, check:state.check, checkView:state.ui.checkView})); }
  catch(_){ /* storage unavailable — the app still works, it just won't remember */ }
}
function restore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved && saved.check && Array.isArray(saved.check.items)){
      state.check = Object.assign(newCheck(), saved.check);
      state.check.items = state.check.items.map(i => Object.assign(newItem(), i));
      state.step = STEPS.includes(saved.step) ? saved.step : 'start';
      state.ui.checkView = saved.checkView === 'review' ? 'review' : 'import';
      if(state.step !== 'start' && !state.check.people.length) state.step = 'people';
    }
  }catch(_){}
}

const lineTotal = item => Math.round((Number(item.qty)||0) * (Number(item.unitPrice)||0));
/* Quantity accounting: an item of qty 3 holds three assignable units.
   assignedUnits + remainingUnits === qty, always. */
const unitsOf   = item => item.units || (item.units = {});
const unitsFor  = (item, pid) => Math.max(0, Number(unitsOf(item)[pid]) || 0);
const assignedUnits = item => Object.values(unitsOf(item)).reduce((a,b)=> a + (Number(b)||0), 0);
const remainingUnits = item => Math.max(0, (Number(item.qty)||0) - assignedUnits(item));

/* -------------------------- calculation engine -------------------------- */
/** Allocate a single item's line total across people. Pure — no UI knowledge. */
function allocateItem(item, people){
  const line = lineTotal(item);
  const ids  = people.map(p=>p.id);
  const empty = {map:{}, allocated:0, unallocated:line, over:0, note:null, sharedWith:[]};
  if (line === 0) return {map:{}, allocated:0, unallocated:0, over:0, note:null, sharedWith:[]};

  if (item.mode === 'everyone'){
    if (!ids.length) return empty;
    const parts = allocate(line, ids.map(()=>1)); const map = {};
    ids.forEach((id,i)=> map[id] = parts[i]);
    return {map, allocated:line, unallocated:0, over:0, note:`Everyone · ${ids.length}`, sharedWith:ids};
  }

  if (item.mode === 'custom'){
    const vals = item.custom.values || {};
    const map = {}; let used = 0;
    if (item.custom.unit === 'percent'){
      const pcts = ids.map(id => Number(vals[id]) || 0);
      const totalPct = pcts.reduce((a,b)=>a+b,0);
      if (Math.abs(totalPct - 100) < 0.005){
        const parts = allocate(line, pcts);
        ids.forEach((id,i)=>{ if (pcts[i] > 0) map[id] = parts[i]; });
        used = line;
      } else {
        ids.forEach((id,i)=>{ if (pcts[i] > 0){ const a = Math.round(line * pcts[i] / 100); map[id] = a; used += a; } });
      }
    } else {
      ids.forEach(id => { const a = Math.round(Number(vals[id]) || 0); if (a !== 0){ map[id] = a; used += a; } });
    }
    const who = Object.keys(map);
    return { map, allocated: Math.min(used, line), unallocated: Math.max(0, line - used), over: Math.max(0, used - line),
             note: who.length ? `Custom · ${who.length} ${who.length===1?'person':'people'}` : null, sharedWith: who };
  }

  if (item.mode === 'units'){
    // Weight by units, with the leftover units as their own weight, so the
    // split is exact even when unitPrice × units wouldn't divide evenly.
    const counts = ids.map(id => unitsFor(item, id));
    const used = counts.reduce((a,b)=>a+b, 0);
    const left = Math.max(0, (Number(item.qty)||0) - used);
    if (used === 0) return empty;
    const parts = allocate(line, [...counts, left]);
    const map = {};
    ids.forEach((id,i) => { if (counts[i] > 0) map[id] = parts[i]; });
    const who = ids.filter((id,i) => counts[i] > 0);
    return { map, allocated: line - parts[ids.length], unallocated: parts[ids.length], over: 0,
             note: `${used} of ${item.qty} assigned`, sharedWith: who,
             units: Object.fromEntries(who.map(id => [id, unitsFor(item, id)])) };
  }

  const sel = (item.people||[]).filter(id => ids.includes(id));
  if (!sel.length) return empty;
  const parts = allocate(line, sel.map(()=>1)); const map = {};
  sel.forEach((id,i)=> map[id] = parts[i]);
  return { map, allocated:line, unallocated:0, over:0,
           note: sel.length > 1 ? `Shared · ${sel.length} people` : null, sharedWith: sel };
}

function itemStatus(item){
  const res = allocateItem(item, state.check.people);
  if (item.mode === 'units'){
    const left = remainingUnits(item);
    if (assignedUnits(item) === 0) return {kind:'unassigned', label:'Unassigned', detail:`${item.qty} to assign`};
    if (left > 0) return {kind:'unassigned', label:`${left} left`, detail:`${assignedUnits(item)} of ${item.qty} assigned`};
    return {kind:'shared', label:`All ${item.qty} assigned`, detail:null};
  }
  if (res.over > 0)            return {kind:'invalid', label:'Over-allocated', detail:`${money(res.over)} more than the item costs`};
  if (item.mode === 'custom' && res.unallocated > 0) return {kind:'invalid', label:'Incomplete split', detail:`${money(res.unallocated)} still needs to be allocated`};
  if (res.unallocated > 0 && lineTotal(item) > 0)    return {kind:'unassigned', label:'Unassigned', detail:'Nobody is paying for this yet'};
  if (res.sharedWith.length > 1) return {kind:'shared', label:res.note, detail:null};
  return {kind:'assigned', label:'Assigned', detail:null};
}

/**
 * Full per-person breakdown for the whole check.
 *
 * Order (the one thing everything else depends on):
 *   items subtotal → discount → service charge → VAT → total
 *
 * VAT-exclusive: VAT = taxable × rate, added on top.
 * VAT-inclusive: the printed prices already contain VAT, so VAT is EXTRACTED
 *   from the taxable amount (rate / (1 + rate), i.e. ×14/114 at 14%) and the
 *   total is the taxable amount itself — never taxable + VAT.
 *
 * Everything is integer minor units, and every proportional component is split
 * with the same largest-remainder allocator across [people…, unassigned], so
 * the parts always sum back to the check total exactly.
 */
function compute(){
  const c = state.check, people = c.people;
  const per = {}; people.forEach(p => per[p.id] = {id:p.id, name:p.name, lines:[], base:0});
  let baseAllocated = 0, baseUnallocated = 0, overAllocated = 0;
  const unassigned = [], invalid = [];

  c.items.forEach(item => {
    const line = lineTotal(item);
    const res  = allocateItem(item, people);
    baseAllocated   += res.allocated;
    baseUnallocated += res.unallocated;
    overAllocated   += res.over;
    if (res.unallocated > 0 && line > 0) unassigned.push({item, cents:res.unallocated});
    if (res.over > 0 || (item.mode === 'custom' && res.unallocated > 0)) invalid.push(item);
    Object.entries(res.map).forEach(([pid, cents]) => {
      if (!per[pid] || cents === 0) return;
      per[pid].lines.push({
        name: item.name || 'Untitled item', cents, note: res.note,
        units: res.units ? res.units[pid] : null,
        qtyLabel: res.units ? `× ${res.units[pid]}` : null
      });
      per[pid].base += cents;
    });
  });

  const rate = vatRateOf(c);

  // 1 — items subtotal (line totals, each already net of any item-level discount)
  const itemsSubtotal = baseAllocated + baseUnallocated;

  // 2 — discount, applied once, to the items subtotal, before anything else
  const rawDiscount = !c.discount.enabled ? 0 : c.discount.mode === 'percent'
    ? Math.round(itemsSubtotal * (Number(c.discount.value) || 0) / 100)
    : Math.round(Number(c.discount.value) || 0);
  const discount = clamp(rawDiscount, 0, itemsSubtotal);          // never negative, never past free
  const discountedSubtotal = itemsSubtotal - discount;

  // 3 — service charge, on the DISCOUNTED subtotal (not the original)
  const service = !c.serviceCharge.enabled ? 0 : c.serviceCharge.mode === 'percent'
    ? Math.round(discountedSubtotal * (Number(c.serviceCharge.value) || 0) / 100)
    : Math.round(Number(c.serviceCharge.value) || 0);

  // 4 — taxable amount, then VAT
  const taxable = discountedSubtotal + service;
  const vat = c.vatIncluded
    ? Math.round(taxable * rate / (1 + rate))                     // extracted, e.g. ×14/114
    : Math.round(taxable * rate);                                 // added on top

  // 5 — final payable
  const checkTotal = c.vatIncluded ? taxable : taxable + vat;

  // Proportional split of every check-level component, unassigned items included
  // as a weight so nothing leaks and the sum stays exact.
  const n = people.length;
  const rawWeights = [...people.map(p => per[p.id].base), baseUnallocated];
  const weightSum  = rawWeights.reduce((a,b)=>a+b, 0);
  const weights    = weightSum > 0 ? rawWeights : [...people.map(()=>1), 0];
  const discParts = allocate(discount, weights);
  const svcParts  = allocate(service,  weights);
  const vatParts  = allocate(vat,      weights);

  people.forEach((p,i) => {
    const o = per[p.id];
    o.discount = discParts[i]; o.service = svcParts[i]; o.vat = vatParts[i];
    o.total = o.base - o.discount + o.service + (c.vatIncluded ? 0 : o.vat);
  });

  const rows = people.map(p => per[p.id]);
  const unassignedTotal = baseUnallocated - discParts[n] + svcParts[n] + (c.vatIncluded ? 0 : vatParts[n]);
  const allocatedTotal  = rows.reduce((a,r)=> a + r.total, 0);

  // Reconciliation against what the receipt itself printed — never overwritten,
  // only compared. Two minor units of slack absorbs the restaurant's own rounding.
  const printed = (c.scan && c.scan.printed) || null;
  const printedTotal = printed && printed.grandTotal ? printed.grandTotal : null;
  const printedDiff = printedTotal !== null ? checkTotal - printedTotal : null;
  const receiptMismatch = printedDiff !== null && Math.abs(printedDiff) > RECEIPT_TOLERANCE;

  return {
    rows, unassigned, invalid,
    rate, ratePct: +(rate*100).toFixed(2), vatIncluded: c.vatIncluded,
    itemsSubtotal, discount, discountedSubtotal, service, taxable, vat,
    // names kept for the rest of the app
    baseTotal: itemsSubtotal, baseAllocated, baseUnallocated, overAllocated,
    vatTotal: vat, checkTotal, allocatedTotal, unassignedTotal,
    printed, printedTotal, printedDiff, receiptMismatch,
    difference: checkTotal - allocatedTotal - unassignedTotal,
    reconciles: unassignedTotal === 0 && overAllocated === 0 && (checkTotal - allocatedTotal - unassignedTotal) === 0
  };
}
const RECEIPT_TOLERANCE = 2;   // minor units of acceptable rounding drift

/* ============================== OCR =====================================
   extractCheckFromImage(file) is the seam. `activeProvider` is the only thing
   to swap to change engines — the preprocessing, parsing and review flow below
   all speak the same structured shape.

   The shipped provider runs Tesseract (WebAssembly) in a worker on this
   device. The photo is never uploaded anywhere: no API key, no account, no
   server. Tesseract is lazy-loaded the first time someone scans, so the app's
   first paint stays light.
   ====================================================================== */
class FriendlyError extends Error {}

/* The engine is four separate downloads: the library, the worker script, the
   WASM core and the language data. They are NOT all on one host, and a single
   unreachable one used to hang the whole scan until a 90-second wall. Two
   independent source sets are tried, and reachability is probed so a blocked
   host is reported as a connection problem in seconds rather than a timeout in
   minutes. */
/* Production deployments should serve the engine from their own origin: set
   window.SPLIT_CONFIG.OCR_ASSET_BASE (e.g. '/vendor/tesseract/') and the four
   files are read from there instead of a CDN. Same-origin assets survive strict
   content-security policies, work offline and cache like the rest of the app —
   the CDN entries below are only a convenience fallback. Layout expected:
     <base>/tesseract.min.js
     <base>/worker.min.js
     <base>/core/            (tesseract.js-core package contents)
     <base>/lang/            (eng.traineddata.gz, ara.traineddata.gz, …)      */
function localSourceSet(base){
  // Resolve against the page so the worker URL is same-origin however the app
  // is mounted (root, sub-path, or an absolute base given in SPLIT_CONFIG).
  let b;
  try { b = new URL(String(base), (typeof location !== 'undefined' ? location.href : 'https://example.invalid/')).href.replace(/\/+$/, ''); }
  catch(_){ b = String(base).replace(/\/+$/, ''); }
  return {name:'local', local:true, lib:b+'/tesseract.min.js', worker:b+'/worker.min.js', core:b+'/core', lang:b+'/lang'};
}
const DEFAULT_ASSET_BASE = 'vendor/tesseract/';

const OCR_SOURCE_SETS = [
  // PRIMARY: the app's own origin. A Worker may only be constructed from a
  // same-origin script, which is the whole reason the CDN path fails inside a
  // restricted frame. Shipping the engine beside the app removes the problem
  // rather than working around it.
  { name:'jsdelivr (fallback)',
    lib:    'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    worker: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
    core:   'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
    lang:   'https://tessdata.projectnaptha.com/4.0.0' },
  { name:'cdnjs (fallback)',
    lib:    'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js',
    worker: 'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/worker.min.js',
    core:   'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
    lang:   'https://cdn.jsdelivr.net/npm/@tesseract.js-data/4.0.0_best_int' }
];
/* Exactly one local entry, and it goes first: the bundled copy under
   vendor/tesseract/ (or whatever OCR_ASSET_BASE points at). */
OCR_SOURCE_SETS.unshift(localSourceSet(
  (typeof window !== 'undefined' && window.SPLIT_CONFIG && window.SPLIT_CONFIG.OCR_ASSET_BASE) || DEFAULT_ASSET_BASE
));
let OCR_SOURCES = OCR_SOURCE_SETS[0];

/* Language models are loaded on demand: only the selected one is downloaded,
   so an English-only user never pays for the Arabic model. Tesseract accepts
   'eng+ara' to run both at once. */
const OCR_LANGUAGES = [
  {code:'eng',     label:'English'},
  {code:'ara',     label:'العربية'},
  {code:'eng+ara', label:'Both'}
];
function ocrLanguage(){
  const stored = (state && state.check && state.check.ocrLang) || null;
  return stored || (typeof window !== 'undefined' && window.SPLIT_CONFIG && window.SPLIT_CONFIG.OCR_LANG) || 'eng';
}

/** Every failure carries a kind, so the UI can say what actually went wrong. */
class ScanError extends Error {
  constructor(kind, message){ super(message); this.kind = kind; }
}
const SCAN_ERRORS = {
  cdn: {
    title:"Couldn't download the free receipt reader",
    body:"The offline reading engine couldn't be fetched. Check your connection and try again — it only needs to download once, then it's cached on this device."
  },
  workerblocked: {
    title:"Your browser is blocking the receipt reader",
    body:"The reader runs in a background worker that this window won't allow. Open the app from a web address (a local server or a normal website) rather than as a bare file, and it will run."
  },
  fileprotocol: {
    title:"Receipt photo reading needs a local web server",
    body:"For security reasons, your browser blocks the OCR engine when this file is opened directly from disk. Serve the file over http instead — from any static host, or locally with:  python3 -m http.server 8000  then open http://localhost:8000/split-check.html"
  },
  timeout: {
    title:"The receipt is taking longer than expected",
    body:"The first scan also downloads the reading engine, which can be slow on a weak connection. Try again, or enter the receipt by hand."
  },
  unreadable: {
    title:"We couldn't read this receipt clearly",
    body:"Try a flat, well-lit photo taken straight above the receipt."
  },
  notreceipt: {
    title:"This image doesn't look like a receipt",
    body:"No priced lines were found in it. Try another photo."
  },
  image: {
    title:"We couldn't process this image",
    body:"Please select a JPG, PNG or other standard receipt photo, under 20 MB."
  },
  notallowed: {
    title:"Reading the photo wasn't allowed",
    body:"Permission was declined. Try again, or enter the receipt yourself."
  }
};

/* Web Workers can be refused outright — on file:// URLs, and in some embedded
   views. Tesseract has no non-worker mode, so this decides up front whether
   on-device OCR is possible, before any download is attempted. */
let workerSupport = null;
function canUseWorkers(){
  if (workerSupport !== null) return workerSupport;
  try{
    if (typeof Worker === 'undefined') throw new Error('Worker is not defined');
    const url = URL.createObjectURL(new Blob(['self.close()'], {type:'text/javascript'}));
    const w = new Worker(url);
    w.terminate(); URL.revokeObjectURL(url);
    workerSupport = true;
  }catch(e){
    workerSupport = false;
    OCR_DIAGNOSTICS.workers = 'blocked: ' + ((e && e.message) || e);
  }
  return workerSupport;
}

/* Decisive and instant: can a Worker be constructed from the URL we would
   actually use? Construction throws synchronously when the origin is refused,
   so this answers the question without downloading anything — and without
   retrying CDN after CDN hoping one behaves differently. */
function canConstructWorkerFrom(url){
  try{
    const w = new Worker(url);
    w.terminate();
    return {ok:true};
  }catch(e){
    const msg = (e && e.message) || String(e);
    return {ok:false, crossOrigin: /cannot be accessed from origin|cross-?origin/i.test(msg), message: msg};
  }
}

/** Can this window actually download the engine? One cheap request, 4s cap. */
async function canFetchEngine(){
  try{
    await Promise.race([
      fetch(OCR_SOURCES.lib, {method:'GET', cache:'force-cache', mode:'cors'}),
      new Promise((_, rej) => setTimeout(() => rej(new Error('slow')), 4000))
    ]);
    return true;
  }catch(e){
    if (e && e.message === 'slow') return true;      // slow is not blocked
    OCR_DIAGNOSTICS.engineFetch = 'blocked: ' + ((e && e.message) || e);
    return false;
  }
}

/** Is the problem the network, or just slowness? Answered in seconds, not minutes. */
async function probeEngineReachable(){
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return false;
  try{
    await Promise.race([
      fetch(OCR_SOURCES.worker, {method:'GET', cache:'force-cache', mode:'cors'}),
      new Promise((_, rej) => setTimeout(() => rej(new Error('slow')), 6000))
    ]);
    return true;
  }catch(e){
    return e && e.message === 'slow' ? true : false;   // slow is not unreachable
  }
}

let tesseractLoading = null;
function loadTesseract(onProgress){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (tesseractLoading) return tesseractLoading;
  onProgress && onProgress('engine', 0.08, 'Starting the text engine\u2026');
  tesseractLoading = (async () => {
    let lastErr = null;
    for (const set of OCR_SOURCE_SETS){
      try {
        await loadScript(set.lib, 12000);
        if (window.Tesseract){ OCR_SOURCES = set; return window.Tesseract; }
      } catch(e){ lastErr = e; }
    }
    tesseractLoading = null;
    throw lastErr || new ScanError('cdn', 'engine unavailable');
  })();
  return tesseractLoading;
}
function loadScript(src, ms){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    const timer = setTimeout(() => { s.remove(); reject(new ScanError('cdn', 'library download timed out')); }, ms);
    s.onload  = () => { clearTimeout(timer); resolve(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); reject(new ScanError('cdn', 'library could not be downloaded')); };
    document.head.appendChild(s);
  });
}

/* ------------------------- image preprocessing -------------------------
   Deliberately gentle: EXIF-correct orientation, size into Tesseract's happy
   range, flatten to grayscale, stretch contrast between the 2nd and 98th
   percentile (so a dim phone photo gains range without crushing a good one),
   and a mild unsharp mask. No binarisation, no deskew — both do more harm
   than good on a curled receipt shot by hand. */
/* Recognition time is roughly linear in pixel count, so the two levers that
   matter are: send fewer pixels, and make sure the pixels sent are the receipt
   rather than the table. Both are done here.

   Pass 1 (cheap, <=0.8 MP) finds the receipt's ink boundary.
   Pass 2 redraws just that region from the ORIGINAL bitmap, fitted to the OCR
   budget — so cropping raises effective text resolution instead of lowering it. */
const OCR_PIXEL_BUDGET = 1.6e6;    // was 2.2e6 — ~27% fewer pixels to recognise
const OCR_MAX_LONG = 1600;
const OCR_MIN_LONG = 1000;

function grayAndStretch(ctx, w, h){
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const gray = new Uint8Array(w * h);
  const hist = new Uint32Array(256);
  for (let i = 0, g = 0; i < d.length; i += 4, g++){
    const v = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) | 0;
    gray[g] = v; hist[v]++;
  }
  const total = w * h;
  let lo = 0, hi = 255, acc = 0;
  for (let v = 0; v < 256; v++){ acc += hist[v]; if (acc > total * 0.02){ lo = v; break; } }
  acc = 0;
  for (let v = 255; v >= 0; v--){ acc += hist[v]; if (acc > total * 0.02){ hi = v; break; } }
  const stretch = hi - lo > 40;
  const lut = new Uint8Array(256);
  for (let v = 0; v < 256; v++) lut[v] = stretch ? clamp(Math.round((v - lo) * 255 / (hi - lo)), 0, 255) : v;
  for (let i = 0, g = 0; i < d.length; i += 4, g++){
    const v = lut[gray[g]]; gray[g] = v; d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // Ink threshold from the dark tail: receipts are mostly light, text is the minority.
  let dark = 0, thr = 128;
  const h2 = new Uint32Array(256);
  for (let g = 0; g < gray.length; g++) h2[gray[g]]++;
  for (let v = 0; v < 256; v++){ dark += h2[v]; if (dark > total * 0.10){ thr = clamp(v + 12, 60, 170); break; } }
  return {gray, threshold: thr};
}

/** Bounding box of the inked area — the receipt, not the tablecloth. Pure and testable. */
function findInkBounds(gray, w, h, threshold){
  const rows = new Uint32Array(h), cols = new Uint32Array(w);
  for (let y = 0; y < h; y++){
    const off = y * w;
    for (let x = 0; x < w; x++) if (gray[off + x] < threshold){ rows[y]++; cols[x]++; }
  }
  const rowMin = Math.max(2, w * 0.012), colMin = Math.max(2, h * 0.012);
  let top = 0, bottom = h - 1, left = 0, right = w - 1;
  while (top < bottom && rows[top] < rowMin) top++;
  while (bottom > top && rows[bottom] < rowMin) bottom--;
  while (left < right && cols[left] < colMin) left++;
  while (right > left && cols[right] < colMin) right--;
  if (bottom - top < h * 0.2 || right - left < w * 0.2) return null;   // nonsense crop, keep everything
  const padX = Math.round(w * 0.02), padY = Math.round(h * 0.02);
  return {
    x: Math.max(0, left - padX), y: Math.max(0, top - padY),
    w: Math.min(w, right + padX) - Math.max(0, left - padX),
    h: Math.min(h, bottom + padY) - Math.max(0, top - padY)
  };
}

async function preprocessImage(file){
  let bitmap;
  try { bitmap = await createImageBitmap(file, {imageOrientation:'from-image'}); }   // EXIF orientation
  catch(_){
    try { bitmap = await createImageBitmap(file); }
    catch(e){ throw new ScanError('image', 'undecodable image'); }
  }

  // --- pass 1: cheap analysis to locate the receipt ---
  let crop = null;
  try{
    const aScale = Math.min(1, 900 / Math.max(bitmap.width, bitmap.height));
    const aw = Math.max(1, Math.round(bitmap.width * aScale)), ah = Math.max(1, Math.round(bitmap.height * aScale));
    const ac = document.createElement('canvas'); ac.width = aw; ac.height = ah;
    const actx = ac.getContext('2d', {willReadFrequently:true});
    actx.drawImage(bitmap, 0, 0, aw, ah);
    const {gray, threshold} = grayAndStretch(actx, aw, ah);
    const box = findInkBounds(gray, aw, ah, threshold);
    // Only worth a crop if it removes a real amount of background.
    if (box && box.w * box.h < aw * ah * 0.9){
      crop = { x: box.x / aScale, y: box.y / aScale, w: box.w / aScale, h: box.h / aScale };
    }
    ac.width = 0; ac.height = 0;
  }catch(_){ crop = null; }

  const src = crop || {x:0, y:0, w:bitmap.width, h:bitmap.height};

  // --- pass 2: final image for OCR, drawn from the original at the right size ---
  const px = src.w * src.h;
  const longest = Math.max(src.w, src.h);
  let scale = 1;
  if (px > OCR_PIXEL_BUDGET) scale = Math.sqrt(OCR_PIXEL_BUDGET / px);
  if (longest * scale > OCR_MAX_LONG) scale = OCR_MAX_LONG / longest;
  if (longest * scale < OCR_MIN_LONG) scale = Math.min(2.5, OCR_MIN_LONG / longest);
  const w = Math.max(1, Math.round(src.w * scale));
  const h = Math.max(1, Math.round(src.h * scale));

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bitmap, src.x, src.y, src.w, src.h, 0, 0, w, h);
  if (bitmap.close) bitmap.close();

  grayAndStretch(ctx, w, h);
  // Sharpening only pays for itself when downscaling softened the text.
  if (scale < 0.95) unsharp(ctx, w, h, 0.5);
  return {canvas, cropped: !!crop, pixels: w * h};
}

function unsharp(ctx, w, h, amount){
  const src = ctx.getImageData(0, 0, w, h);
  const s = src.data;
  const out = ctx.createImageData(w, h);
  const o = out.data;
  for (let y = 1; y < h - 1; y++){
    for (let x = 1; x < w - 1; x++){
      const i = (y*w + x) * 4;
      const c = s[i];
      const neighbours = s[i-4] + s[i+4] + s[i - w*4] + s[i + w*4];
      const v = clamp(Math.round(c + amount * (4*c - neighbours) * 0.25), 0, 255);
      o[i] = o[i+1] = o[i+2] = v; o[i+3] = 255;
    }
  }
  // edges copied through untouched
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    if (x && y && x < w-1 && y < h-1) continue;
    const i = (y*w + x) * 4;
    o[i] = o[i+1] = o[i+2] = s[i]; o[i+3] = 255;
  }
  ctx.putImageData(out, 0, 0);
}

/* ---------------------------- receipt parsing --------------------------- */
const CURRENCIES = [
  [/\b(aed|dhs|dh|dirham)\b/i, 'AED'], [/\bsar\b|\briyal\b/i, 'SAR'], [/\bqar\b/i, 'QAR'],
  [/\bkwd\b/i, 'KWD'], [/\bbhd\b/i, 'BHD'], [/\bomr\b/i, 'OMR'], [/\begp\b/i, 'EGP'],
  [/\busd\b|\$/i, 'USD'], [/\beur\b|€/i, 'EUR'], [/\bgbp\b|£/i, 'GBP'], [/\binr\b|₹/i, 'INR']
];
// Lines that are never food, even when they carry a price.
const NON_ITEM = /\b(sub\s*-?\s*total|subtotal|total|amount\s*(due|paid)|balance|change|cash|card|visa|master(card)?|amex|payment|paid|tender|tip|gratuity|rounding|net\s*(amount|total)|gross|vat|v\.a\.t|tax|t\.r\.n|trn|tin|service\s*(charge)?|svc|discount|promo|voucher|coupon|receipt|invoice|bill\s*(no|number)|order\s*(no|number)|check\s*(no|number)|date|time|table|server|waiter|waitress|cashier|guests?|covers?|pax|thank|welcome|please|www\.|http|tel[:\s]|phone|address|qty|description|item\s*name|price|amount)\b/i;
const MONEY = /-?\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|-?\d+\.\d{1,2}|-?\d+/g;

const toTitle = s => /[a-z]/.test(s) ? s : s.toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase());
// Fix the OCR confusions that only matter inside a number run (45.OO -> 45.00),
// written without lookbehind so older Safari can still parse this file.
const tidyNumbers = s => s.replace(/\d[\dOolI.,]*/g, run => run.replace(/[Oo]/g,'0').replace(/[lI]/g,'1'));

function moneyTokens(text){
  const m = tidyNumbers(text).match(MONEY);
  if (!m) return [];
  return m.map(t => ({ raw:t, cents: Math.round(parseFloat(t.replace(/,/g,'')) * 100), decimal: /\.\d{1,2}$/.test(t) }));
}

/**
 * Turn OCR lines into the app's structured check shape.
 * Everything it can't confidently classify is left out rather than guessed at —
 * a missing line the user adds beats a wrong line they don't notice.
 */
function parseReceipt(lines, overallConfidence){
  const rawText = lines.map(l => l.text).join('\n');
  const totals = {subtotal:null, vat:null, serviceCharge:null, discount:null, grandTotal:null};
  const items = [], suspects = [];

  let currency = 'AED';
  for (const [re, code] of CURRENCIES){ if (re.test(rawText)){ currency = code; break; } }

  lines.forEach(line => {
    // Tidy OCR's number confusions once, then work on that text throughout —
    // slicing against the untidied original loses the last digit of "18.OO".
    const text = tidyNumbers(line.text.replace(/\s+/g, ' ').trim());
    if (text.length < 2) return;
    const nums = moneyTokens(text);
    const last = nums.length ? nums[nums.length - 1] : null;
    const hasTotal = /\b(grand\s*total|total|amount\s*(due|paid)|balance\s*due)\b/i.test(text);
    const hasVat   = /\b(vat|v\.a\.t|tax)\b/i.test(text) && !/\b(no|trn|tin|reg)\b/i.test(text);

    // check-level lines, most specific first
    if (/\bsub\s*-?\s*total\b/i.test(text))                { if (last) totals.subtotal = last.cents; return; }
    if (/\bservice\b|\bsvc\b/i.test(text))                 { if (last) totals.serviceCharge = last.cents; return; }
    if (/\bdiscount\b|\bpromo\b|\bvoucher\b/i.test(text))  { if (last) totals.discount = Math.abs(last.cents); return; }
    // "Total (inclusive of VAT)" is a total; "Total VAT" is a VAT line.
    if (hasTotal && (!hasVat || /inclusive|includ|incl\b/i.test(text))) { if (last) totals.grandTotal = last.cents; return; }
    if (hasVat)                                            { if (last && last.decimal) totals.vat = last.cents; return; }
    if (hasTotal)                                          { if (last) totals.grandTotal = last.cents; return; }
    if (NON_ITEM.test(text)) return;
    if (!last || !nums.length) return;

    // needs a plausible name: letters, not just a code
    const lastIdx = text.lastIndexOf(last.raw);
    if (lastIdx < 0) return;
    let name = text.slice(0, lastIdx).trim();
    if (!/[A-Za-z]{2,}/.test(name)) return;

    let qty = 1, lineCents = last.cents, unitCents = null;

    // "3 x Arabic Bread 5.00 15.00" — a unit price sitting before the line total
    if (nums.length >= 2){
      const prev = nums[nums.length - 2];
      const prevIdx = text.lastIndexOf(prev.raw, Math.max(0, lastIdx - 1));
      if (prevIdx >= 0 && prev.decimal && prev.cents > 0 && last.cents >= prev.cents){
        const ratio = last.cents / prev.cents;
        const rounded = Math.round(ratio);
        if (rounded >= 1 && rounded <= 30 && Math.abs(ratio - rounded) < 0.02){
          unitCents = prev.cents; qty = rounded;
          name = text.slice(0, prevIdx).trim();
        }
      }
    }
    // leading or trailing quantity: "2 Water", "3x Water", "Water x2"
    const lead = name.match(/^(\d{1,2})\s*[xX×]?\s+(?=\D)/);
    if (lead && Number(lead[1]) > 0 && Number(lead[1]) <= 30){ if (unitCents === null) qty = Number(lead[1]); name = name.slice(lead[0].length); }
    const trail = name.match(/\s*[xX×]\s*(\d{1,2})\s*$/);
    if (trail && Number(trail[1]) > 0){ if (unitCents === null) qty = Number(trail[1]); name = name.slice(0, trail.index); }

    name = toTitle(name.replace(/[.·•*_|]+$/,'').replace(/^[-–—•*.\s]+/,'').replace(/\s{2,}/g,' ').trim());
    if (name.length < 2 || !/[A-Za-z]{2,}/.test(name)) return;
    if (lineCents > 10000000) return;
    // A line that reads like an item but whose price came out garbled is held
    // back rather than dropped — losing a dish silently is worse than showing
    // it with an empty price for the user to fill in.
    if (lineCents <= 0){ suspects.push({name, qty:1, unitPrice:0, confidence:0.15}); return; }
    if (unitCents === null) unitCents = Math.round(lineCents / qty);

    // Confidence: Tesseract's own line confidence where we have it, held back
    // when the line looks structurally shaky. No invented precision.
    let conf = typeof line.conf === 'number' ? line.conf / 100 : Math.min(0.55, (overallConfidence || 60) / 100);
    if (!last.decimal) conf = Math.min(conf, 0.5);           // price had no decimals — often a misread
    if (name.length < 4) conf = Math.min(conf, 0.55);
    if (/[^A-Za-z0-9 &'()\/.,+-]/.test(name)) conf = Math.min(conf, 0.5);
    items.push({name, qty, unitPrice:unitCents, confidence: clamp(conf, 0.05, 0.97)});
  });

  // Only trust half-read lines when the rest of the page clearly read as a
  // receipt — otherwise a photo of a menu would fill up with zero-price rows.
  if (items.length && suspects.length && suspects.length <= 3) items.push(...suspects);

  // VAT inclusive or not: wording first, then arithmetic, then a safe default.
  let vatIncluded = true;
  if (/\b(inclusive of|includes?|incl\.?)\s*(all\s*)?(taxes|vat)|vat\s*inclusive|prices?\s*include/i.test(rawText)) vatIncluded = true;
  else if (/\b(exclusive of|excl\.?)\s*vat|vat\s*(will be\s*)?(extra|added)|\+\s*5\s*%\s*vat/i.test(rawText)) vatIncluded = false;
  else if (totals.subtotal && totals.vat && totals.grandTotal){
    const addedUp = totals.subtotal + totals.vat + (totals.serviceCharge || 0) - (totals.discount || 0);
    if (Math.abs(addedUp - totals.grandTotal) <= 50) vatIncluded = false;        // VAT sits on top of the printed prices
    else if (Math.abs(totals.subtotal - totals.grandTotal) <= 50) vatIncluded = true;
  }

  // A rate the receipt states outright ("VAT 14%", "VAT (5%)") beats any default.
  let printedRate = null;
  const rateMatch = rawText.match(/\b(?:vat|v\.a\.t|tax)\b[^%\n]{0,12}?(\d{1,2}(?:\.\d)?)\s*%/i)
                 || rawText.match(/(\d{1,2}(?:\.\d)?)\s*%\s*(?:vat|v\.a\.t|tax)\b/i);
  if (rateMatch){
    const pct = parseFloat(rateMatch[1]);
    if (pct > 0 && pct < 30) printedRate = pct / 100;
  }

  const itemsSum = items.reduce((a, i) => a + i.qty * i.unitPrice, 0);
  return {
    currency, vatIncluded, vatRate: printedRate,
    merchant: findMerchant(lines), date: findDate(rawText),
    items,
    subtotal: totals.subtotal ?? itemsSum,
    vat: totals.vat ?? 0,
    serviceCharge: totals.serviceCharge ?? 0,
    discount: totals.discount ?? 0,
    grandTotal: totals.grandTotal ?? itemsSum,
    rawText,
    itemsSum,
    overallConfidence: overallConfidence ?? null
  };
}

function findMerchant(lines){
  // Restaurant name sits in the first few lines: mostly letters, no long digit runs.
  for (const line of lines.slice(0, 6)){
    const t = line.text.replace(/\s+/g,' ').trim();
    if (t.length < 3 || t.length > 42) continue;
    if (/\d{3,}/.test(t) || NON_ITEM.test(t)) continue;
    const letters = (t.match(/[A-Za-z]/g) || []).length;
    if (letters < t.length * 0.6) continue;
    const cleaned = t.replace(/[^A-Za-z0-9 &'.\-]/g, '').replace(/\s{2,}/g,' ').trim();
    if (cleaned.length >= 3) return toTitle(cleaned);
  }
  return null;
}
function findDate(text){
  const m = text.match(/\b\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}\b/)
        || text.match(/\b\d{4}-\d{2}-\d{2}\b/)
        || text.match(/\b\d{1,2}\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{2,4}\b/i);
  return m ? m[0] : null;
}

function collectLines(data){
  const out = [];
  const push = l => { const t = (l.text || '').replace(/\s+/g,' ').trim(); if (t) out.push({text:t, conf: typeof l.confidence === 'number' ? l.confidence : null}); };
  if (Array.isArray(data.lines) && data.lines.length) data.lines.forEach(push);
  else if (Array.isArray(data.blocks)) data.blocks.forEach(b => (b.paragraphs||[]).forEach(p => (p.lines||[]).forEach(push)));
  if (!out.length && data.text) String(data.text).split(/\r?\n/).forEach(t => push({text:t, confidence:null}));
  return out;
}

/* ------------------------- the shipped provider -------------------------
   Performance notes (measured against the previous version's ordering):
   - The engine (script + WASM core + language data) is the dominant cost and
     it is a ONE-TIME cost per browser. It used to be paid on every scan
     because the worker was terminated in a `finally`. The worker is now kept
     warm between scans and only retired after two idle minutes.
   - Engine start-up and image preprocessing are independent, so they now run
     concurrently instead of one after the other.
   - Recognition time scales with pixel count, so the image is fitted to a
     pixel budget rather than a long-edge cap (a tall receipt was previously
     allowed to reach ~7 MP).
   - Only the text/blocks outputs are requested; hOCR, TSV and box output cost
     time to generate and this app never reads them. */
class CancelledError extends Error {}
const ENGINE_TIMEOUT_MS = 40000;          // cached engine: should be quick
const ENGINE_FIRST_RUN_TIMEOUT_MS = 150000; // first run downloads ~6 MB of engine + model
const RECOGNIZE_TIMEOUT_MS = 75000; // recognition itself, on a warm engine
const SLOW_HINT_MS = 12000;         // when the copy softens to 'still reading'
const SLOW_HINT_VISION_MS = 20000;  // Claude thinks before it writes: 5-60s is normal
const scanCache = new Map();          // same photo submitted twice = no second pass
let progressSink = null;              // the live call's reporter (worker outlives any one call)
let workerPromise = null, workerIdleTimer = null, workerLang = null;

let engineEverLoaded = false;
try { engineEverLoaded = localStorage.getItem('split.engineLoaded') === '1'; } catch(_){}

function ocrLogger(m){
  if (!progressSink) return;
  const pct = Math.round((m.progress || 0) * 100);
  if (m.status === 'recognizing text'){
    // Tesseract's own progress — never invented.
    progressSink('reading', 0.45 + (m.progress || 0) * 0.45, `Reading receipt… ${pct}%`);
  } else if (/loading language|loading tesseract|initializ|loading core/i.test(m.status || '')){
    progressSink('engine', 0.12 + (m.progress || 0) * 0.3,
      engineEverLoaded ? 'Starting the reader…'
                       : `First-time setup — downloading the free offline reader… ${pct}%`);
  }
}
/* Worker creation is where scans were dying. Three things in the default
   configuration can fail hard inside a sandboxed iframe, and all three failed
   SILENTLY — the promise simply never settled, which is why the only symptom
   was a timeout:
     1. workerBlobURL: true (the default) builds the worker from a blob: URL.
        A content-security policy that doesn't list blob: refuses it.
     2. cacheMethod defaults to writing the language data into IndexedDB.
        IndexedDB throws on an opaque origin, which a sandboxed frame has.
     3. createWorker has no error handler by default, so an in-worker failure
        never rejects the promise.
   Each attempt below removes one of those assumptions, in order, and every
   attempt now has an errorHandler and its own budget. Whatever happens is
   recorded in OCR_DIAGNOSTICS so the real reason is visible, not inferred. */
const OCR_DIAGNOSTICS = { attempts: [], assets: [], lastError: null, log: [] };
/* Structured events around the reader. Never records receipt contents —
   only sizes, types, timings and error classes. */
let logT0 = 0;
function ocrLog(event, detail){
  if (!logT0) logT0 = Date.now();
  const entry = {t: Date.now() - logT0, event, detail: detail || ''};
  OCR_DIAGNOSTICS.log.push(entry);
  if (OCR_DIAGNOSTICS.log.length > 60) OCR_DIAGNOSTICS.log.shift();
  try { console.info(`[reader] +${entry.t}ms ${event}`, detail || ''); } catch(_){}
}

function workerConfigs(){
  const lang = ocrLanguage();
  const base = {
    workerPath: OCR_SOURCES.worker, corePath: OCR_SOURCES.core,
    langPath: OCR_SOURCES.lang, logger: ocrLogger
  };
  const withLang = c => Object.assign(c, {lang});
  return [
    // Cache the language model in IndexedDB first: that is what makes the
    // second and later receipts fast in a normal browser.
    // The worker script is always loaded from a URL on this origin, never a
    // blob and never a CDN — that is the restriction the browser enforces.
    {label:'same-origin worker, model cached', opts:{...base, workerBlobURL:false}},
    {label:'same-origin worker, no cache',     opts:{...base, workerBlobURL:false, cacheMethod:'none'}},
    {label:'blob worker, model cached',        opts:{...base}}
  ].map(withLang);
}

function createWorkerAttempt(Tesseract, cfg, ms){
  return new Promise((resolve, reject) => {
    let settled = false;
    const finish = (fn, v) => { if (!settled){ settled = true; clearTimeout(timer); fn(v); } };
    const timer = setTimeout(() => finish(reject, new ScanError('timeout', `${cfg.label}: no response in ${ms/1000}s`)), ms);
    const classify = msg => /construct 'Worker'|Worker is not defined|worker/i.test(String(msg)) ? 'workerblocked'
                          : /fetch|network|load/i.test(String(msg)) ? 'cdn' : 'cdn';
    let p;
    try {
      p = Tesseract.createWorker(cfg.lang || 'eng', 1, {
        ...cfg.opts,
        errorHandler: e => finish(reject, new ScanError(classify(e && e.message), `${cfg.label}: ${(e && e.message) || e}`))
      });
    } catch(e){ return finish(reject, new ScanError(classify(e && e.message), `${cfg.label}: ${e && e.message}`)); }
    p.then(w => finish(resolve, w), e => finish(reject, new ScanError(classify(e && e.message), `${cfg.label}: ${(e && e.message) || e}`)));
  });
}

function getWorker(Tesseract){
  clearTimeout(workerIdleTimer);
  if (workerPromise && workerLang !== ocrLanguage()){
    const stale = workerPromise; workerPromise = null;
    stale.then(w => { try { w.terminate(); } catch(_){} }, () => {});
  }
  workerLang = ocrLanguage();
  if (!workerPromise){
    workerPromise = (async () => {
      let lastErr = null;
      for (const cfg of workerConfigs()){
        const t0 = Date.now();
        try{
          const w = await createWorkerAttempt(Tesseract, cfg, 20000);
          OCR_DIAGNOSTICS.attempts.push({config:cfg.label, ok:true, ms:Date.now()-t0});
          await w.setParameters({
            tessedit_pageseg_mode:'4',
            preserve_interword_spaces:'1',
            tessedit_do_invert:'0',      // skips Tesseract's second, inverted pass — receipts are dark-on-light
            user_defined_dpi:'300'       // stops the DPI-guessing heuristic from re-running
          });
          engineEverLoaded = true;
          try { localStorage.setItem('split.engineLoaded', '1'); } catch(_){}
          return w;
        }catch(e){
          lastErr = e;
          OCR_DIAGNOSTICS.attempts.push({config:cfg.label, ok:false, ms:Date.now()-t0, error:e.message});
        }
      }
      OCR_DIAGNOSTICS.lastError = lastErr && lastErr.message;
      throw lastErr || new ScanError('workerblocked', 'worker could not start');
    })().catch(e => { workerPromise = null; throw e; });
  }
  return workerPromise;
}

/* Superseded: an earlier engine-init implementation lived here and RETURNED
   THE WORKER. The current initOcrEngine (below) returns OCR_STATUS instead,
   and because both were function declarations the later one silently won —
   which is why the scan path received a status object and failed with
   'worker.recognize is not a function' while the smoke test passed. The dead
   copy is gone; readyWorker() below is the single way the scan path gets a
   worker, and it hands back the very worker the smoke test proved. */

/** Fetch each engine asset separately and report exactly which one fails. */
async function runOcrDiagnostics(){
  const checks = [];
  const add = (ok, name, reason) => checks.push({ok, name, reason: reason || ''});

  add(typeof location !== 'undefined' && location.protocol !== 'file:', 'Protocol',
      (typeof location !== 'undefined' ? location.protocol : '?') +
      (typeof location !== 'undefined' && location.protocol === 'file:' ? ' — workers are blocked on file://' : ''));
  add(typeof WebAssembly === 'object', 'WebAssembly', typeof WebAssembly === 'object' ? 'supported' : 'not available');
  add(canUseWorkers(), 'Web Worker', canUseWorkers() ? 'supported' : (OCR_DIAGNOSTICS.workers || 'blocked'));
  add(true, 'Engine', (OCR_STATUS.engine || 'not chosen yet') + (OCR_STATUS.code ? ` — ${OCR_STATUS.code}` : ''));
  add(!!OCR_DIAGNOSTICS.workerProbe && OCR_DIAGNOSTICS.workerProbe === 'ok', 'Worker constructible',
      OCR_DIAGNOSTICS.workerProbe || 'not probed');
  add(true, 'Engine source', OCR_SOURCES.name + (OCR_SOURCES.local ? ' (same origin)' : ' (cross-origin CDN — bundle vendor/tesseract/ to fix)'));
  add(true, 'Receipt language', ocrLanguage());

  const langs = ocrLanguage().split('+');
  const assets = [
    ['Tesseract library', OCR_SOURCES.lib],
    ['Worker script',     OCR_SOURCES.worker],
    ['WASM core',         OCR_SOURCES.core + '/tesseract-core-simd.wasm.js'],
    ...langs.map(l => [`Language model (${l})`, `${OCR_SOURCES.lang}/${l}.traineddata.gz`])
  ];
  for (const [name, url] of assets){
    const t0 = Date.now();
    try{
      const res = await Promise.race([
        fetch(url, {method:'GET', cache:'force-cache'}),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timed out after 10s')), 10000))
      ]);
      if (res && res.ok === false) throw new Error('HTTP ' + res.status);
      add(true, name, `${url}\n     HTTP ${(res && res.status) || 'ok'}, ${Date.now()-t0}ms`);
    }catch(e){
      add(false, name, `${url}\n     ${(e && e.message) || e}`);
    }
  }

  // Same-origin check on the worker URL specifically — this is the rule that bites.
  try{
    const wUrl = new URL(OCR_SOURCES.worker, location.href);
    const same = wUrl.origin === location.origin;
    add(same, 'Worker is same-origin', same ? wUrl.origin : `worker at ${wUrl.origin} cannot be constructed from ${location.origin}`);
  }catch(_){}

  // The real thing: initialise and run OCR on a known image.
  try{
    const w = await readyWorker(null);
    add(true, 'OCR worker initialised', 'language ' + ocrLanguage());
    add(true, 'OCR smoke test', 'recognised TEST through the worker');
    /* Checks the object the SCAN path actually receives, not merely that init
       resolved. Those two were different things once — the smoke test passed
       while every scan died on worker.recognize — and no diagnostic could see
       it, because nothing asked this question. */
    const usable = !!w && typeof w.recognize === 'function';
    add(usable, 'Scan path worker', usable ? 'recognize() present'
        : 'engine ready but the scan path received ' + Object.prototype.toString.call(w));
  }catch(e){
    add(!!OCR_STATUS.stages.worker, 'OCR worker initialised', OCR_STATUS.stages.worker ? '' : OCR_STATUS.reason);
    add(false, 'OCR smoke test', OCR_STATUS.stages.smoke === false ? OCR_STATUS.reason : 'not reached');
  }

  let idb = 'ok';
  try { if (typeof indexedDB === 'undefined') idb = 'unavailable'; else indexedDB.open('ocr-probe'); }
  catch(e){ idb = 'blocked: ' + ((e && e.name) || 'error'); }
  add(idb === 'ok', 'Model caching (IndexedDB)', idb === 'ok' ? 'models cached after first download' : idb);

  OCR_DIAGNOSTICS.checks = checks;
  OCR_DIAGNOSTICS.status = OCR_STATUS.state;
  OCR_DIAGNOSTICS.indexedDB = idb;
  OCR_DIAGNOSTICS.wasm = (typeof WebAssembly === 'object') ? 'available' : 'unavailable';
  return OCR_DIAGNOSTICS;
}

/* OCR_STATUS reflects what has actually been proven, never what is merely
   plausible. 'ready' is reached only after a real recognition of a known image. */
/* Machine-readable causes, so developer diagnostics name the real component. */
const OCR_FAIL = {
  CROSS_ORIGIN_WORKER: 'cross_origin_worker_blocked',
  WORKER_LOAD:         'worker_load_failed',
  WASM_LOAD:           'wasm_load_failed',
  LANG_LOAD:           'language_model_load_failed',
  LIB_LOAD:            'library_load_failed',
  SMOKE:               'smoke_test_failed',
  ENGINE_UNREACHABLE:  'engine_unreachable',
  NONE_AVAILABLE:      'no_supported_engine'
};

const OCR_STATUS = {
  state:'unknown',            // unknown | initialising | ready | failed
  engine:null,                // 'tesseract' | 'claude-api'
  stages:{library:null, worker:null, core:null, language:null, smoke:null},
  code:'', reason:'', urls:{}
};

/** A tiny image with known text, recognised through the real worker. */
function smokeImage(){
  const c = document.createElement('canvas');
  c.width = 320; c.height = 120;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#000000';
  ctx.font = 'bold 64px monospace';
  ctx.textBaseline = 'middle';
  ctx.fillText('TEST', 60, 62);
  return c;
}

/**
 * Bring the engine up and PROVE it works. Every stage is recorded, and the
 * only path to 'ready' runs a recognition whose output must contain TEST.
 */
async function initOcrEngine(onProgress){
  if (OCR_STATUS.state === 'ready') return OCR_STATUS;
  const detected = await detectReader();
  OCR_STATUS.engine = detected.kind === 'backend' ? 'backend'
                    : detected.kind === 'api' ? 'claude-api'
                    : detected.kind === 'blocked' ? null : 'tesseract';

  if (detected.kind === 'blocked'){
    OCR_STATUS.state = 'failed';
    OCR_STATUS.code = detected.code || OCR_FAIL.WORKER_LOAD;
    OCR_STATUS.reason = detected.reason;
    ocrLog('OCR_ENGINE_INIT_FAILED', OCR_STATUS.code);
    throw new ScanError(detected.why || 'workerblocked', detected.reason);
  }

  if (detected.kind === 'backend'){
    OCR_STATUS.state = 'initialising'; OCR_STATUS.code = ''; OCR_STATUS.reason = '';
    OCR_STATUS.urls = {reader: BACKEND_URL};
    try{
      const h = await backendProvider.healthCheck();
      OCR_STATUS.stages = {library:true, worker:true, core:true, language:true, smoke:!!OCR_STATUS.provenRoundTrip};
      if (!OCR_STATUS.provenRoundTrip){
        // Configured and reachable, but no receipt has completed the round trip
        // yet, so the status stays honest and scanning is allowed to prove it.
        OCR_STATUS.state = 'configured';
        OCR_STATUS.reason = `Server reader configured (${h.model || 'model set by the server'}). Scan a receipt to prove the round trip.`;
        ocrLog('READER_CAPABILITIES_OK', 'backend configured, round trip unproven');
        return OCR_STATUS;
      }
      OCR_STATUS.state = 'ready';
      ocrLog('READER_INIT_SUCCESS', 'OCR_READY — backend round trip proven on a real receipt');
      ocrLog('OCR_READY', BACKEND_URL);
      return OCR_STATUS;
    }catch(e){
      OCR_STATUS.state = 'failed';
      OCR_STATUS.code = (e && e.message) || BACKEND_FAIL.UNREACHABLE;
      OCR_STATUS.reason = OCR_STATUS.code === BACKEND_FAIL.AUTH
        ? 'The server reader has no API key configured.'
        : 'The server reader did not answer.';
      ocrLog('OCR_ENGINE_INIT_FAILED', OCR_STATUS.code);
      throw new ScanError('cdn', OCR_STATUS.reason);
    }
  }

  if (detected.kind === 'api'){
    OCR_STATUS.state = 'initialising';
    OCR_STATUS.code = ''; OCR_STATUS.reason = '';
    OCR_STATUS.urls = {reader: MESSAGES_ENDPOINT};
    try{
      await capabilityTextTest();
      if (CAPABILITY.text !== true) throw new ScanError('cdn', 'reader endpoint unreachable from this window');
      // Text alone is NOT enough: this reader must accept pixels. Until an image
      // test has passed, the engine stays NOT READY rather than assuming.
      if (CAPABILITY.image !== true){
        OCR_STATUS.state = 'failed';
        OCR_STATUS.code = CAPABILITY.image === 'unsupported' ? 'reader_is_text_only' : 'image_capability_unproven';
        OCR_STATUS.reason = CAPABILITY.image === 'unsupported'
          ? 'this window offers a text-only reader, which cannot accept a photo'
          : 'the reader answers text, but sending a photo has not been proven yet — run the capability test';
        ocrLog('OCR_ENGINE_INIT_FAILED', OCR_STATUS.code);
        throw new ScanError('cdn', OCR_STATUS.reason);
      }
      OCR_STATUS.stages = {library:true, worker:true, core:true, language:true, smoke:true};
      OCR_STATUS.state = 'ready'; OCR_STATUS.code = ''; OCR_STATUS.reason = '';
      ocrLog('READER_INIT_SUCCESS', 'OCR_READY via the artifact runtime reader');
      ocrLog('OCR_READY', MESSAGES_ENDPOINT);
      return OCR_STATUS;
    }catch(e){
      OCR_STATUS.state = 'failed';
      // Keep a specific code already set by the branch that knows more
      // (text-only reader, unproven image support) — the generic one is a default.
      if (!OCR_STATUS.code) OCR_STATUS.code = OCR_FAIL.ENGINE_UNREACHABLE;
      if (!OCR_STATUS.reason) OCR_STATUS.reason = (e && e.message) || String(e);
      ocrLog('OCR_ENGINE_INIT_FAILED', `${OCR_STATUS.code}: ${OCR_STATUS.reason}`);
      throw (e instanceof ScanError) ? e : new ScanError('cdn', OCR_STATUS.reason);
    }
  }

  OCR_STATUS.state = 'initialising';
  OCR_STATUS.urls = {library:OCR_SOURCES.lib, worker:OCR_SOURCES.worker,
                     core:OCR_SOURCES.core, language:`${OCR_SOURCES.lang}/${ocrLanguage().split('+')[0]}.traineddata.gz`};
  const CODES = {library:OCR_FAIL.LIB_LOAD, worker:OCR_FAIL.WORKER_LOAD, smoke:OCR_FAIL.SMOKE};
  const fail = (stage, e) => {
    OCR_STATUS.stages[stage] = false;
    OCR_STATUS.state = 'failed';
    OCR_STATUS.reason = (e && e.message) || String(e);
    OCR_STATUS.code = /cannot be accessed from origin/i.test(OCR_STATUS.reason) ? OCR_FAIL.CROSS_ORIGIN_WORKER
                    : /traineddata|language/i.test(OCR_STATUS.reason) ? OCR_FAIL.LANG_LOAD
                    : /wasm|core/i.test(OCR_STATUS.reason) ? OCR_FAIL.WASM_LOAD
                    : (CODES[stage] || OCR_FAIL.WORKER_LOAD);
    ocrLog('OCR_ENGINE_INIT_FAILED', `${OCR_STATUS.code} (${stage}): ${OCR_STATUS.reason}`);
    throw (e instanceof ScanError) ? e : new ScanError('cdn', OCR_STATUS.reason);
  };

  let T;
  try { T = await loadTesseract(onProgress); OCR_STATUS.stages.library = true; }
  catch(e){ fail('library', e); }

  let worker;
  try {
    worker = await getWorker(T);
    OCR_STATUS.stages.worker = true;
    OCR_STATUS.stages.core = true;       // the worker cannot start without the WASM core
    OCR_STATUS.stages.language = true;   // nor without its language data
  } catch(e){ fail('worker', e); }

  // The step that stops this file ever claiming readiness it hasn't earned.
  try{
    onProgress && onProgress('engine', 0.4, 'Checking the reader…');
    const {data} = await withTimeout(worker.recognize(smokeImage()), 60000, 'timeout', 'smoke test timed out');
    const got = String((data && data.text) || '').toUpperCase().replace(/[^A-Z]/g, '');
    if (!/TES?T/.test(got)) throw new ScanError('unreadable', `smoke test read "${got.slice(0,12)}" instead of TEST`);
    OCR_STATUS.stages.smoke = true;
  }catch(e){ fail('smoke', e); }

  OCR_STATUS.state = 'ready'; OCR_STATUS.reason = ''; OCR_STATUS.code = '';
  ocrLog('READER_INIT_SUCCESS', `OCR_READY via ${OCR_SOURCES.name} (${ocrLanguage()})`);
  ocrLog('OCR_READY', OCR_SOURCES.worker);
  return OCR_STATUS;
}

/* The one way the scan path gets a worker. initOcrEngine proves the engine and
   resolves with OCR_STATUS, not a worker — so ask getWorker, whose promise is
   memoised, and the instance that comes back is the same one the smoke test
   recognised "TEST" through. loadTesseract is memoised too, so after init this
   resolves immediately. */
async function readyWorker(onProgress){
  await initOcrEngine(onProgress);
  const T = await loadTesseract(onProgress);
  const w = await getWorker(T);
  if (!w || typeof w.recognize !== 'function')
    throw new ScanError('workerblocked', 'engine reported ready but returned no usable worker');
  return w;
}

function retireWorkerSoon(){
  clearTimeout(workerIdleTimer);
  workerIdleTimer = setTimeout(async () => {
